name: Dependency Review (SCA Gate)

on:
  pull_request:
    branches: [ "dev", "main" ]
    paths:
      - "**/requirements*.txt"
      - "**/package.json"
      - "**/package-lock.json"
      - "**/*.csproj"
      - "**/*.sln"
      - ".github/workflows/*.yml"
      
permissions:
  contents: read
  pull-requests: read

jobs:
  dependency-review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: high
          fail-on-scopes: runtime
          vulnerability-check: true
          license-check: false
