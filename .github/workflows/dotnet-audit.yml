name: dotnet vulnerable packages

on:
  pull_request:
    branches: [ "dev", "main" ]
    paths:
      - "model-cycle/**"
  push:
    branches: [ "dev", "main" ]
  schedule:
    - cron: "37 3 * * 1"

permissions:
  contents: read

jobs:
  dotnet-vuln:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: model-cycle
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "8.0.x"
      - run: dotnet restore
      - name: List vulnerable packages
        run: |
          set -euo pipefail
          dotnet list package --vulnerable --include-transitive | tee vuln.txt
          if grep -Eiq 'Severity:\s*(Critical|High)' vuln.txt; then
            echo "High/Critical vulnerable packages found."
            exit 1
          fi
