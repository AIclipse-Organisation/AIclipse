name: k3d-smoke-template

on:
  workflow_call:
    inputs:
      svc_name:           { type: string,  required: true }
      context:            { type: string,  required: true }
      dockerfile:         { type: string,  required: true }
      image_name:         { type: string,  required: true }
      deployment_yaml:    { type: string,  required: true }
      deployment_name:    { type: string,  required: true }
      container_name:     { type: string,  required: true }
      service_name:       { type: string,  required: true }
      service_port:       { type: number,  required: true }
      health_path:        { type: string,  required: true }
      secrets_yaml:       { type: string,  required: true }
      readiness_selector: { type: string,  required: true }
      rollout_timeout:    { type: string,  required: false, default: "150s" }
      namespace:          { type: string,  required: false, default: "default" }
      k3d_version:        { type: string,  required: false, default: "v5.7.4" }
      k3s_image:          { type: string,  required: false, default: "rancher/k3s:v1.32.2-k3s1" }
      kubectl_version:    { type: string,  required: false, default: "v1.32.2" }

jobs:
  smoke:
    runs-on: ubuntu-latest
    env:
      IMAGE_TAG: ci-${{ github.sha }}
      CLUSTER: ci-${{ inputs.svc_name }}
      SVC_PORT: ${{ inputs.service_port }}
      NAMESPACE: ${{ inputs.namespace }}
      K3D_VERSION: ${{ inputs.k3d_version }}
      K3S_IMAGE: ${{ inputs.k3s_image }}
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build image (load locally, no push)
        uses: docker/build-push-action@v6
        with:
          context: ${{ inputs.context }}
          file: ${{ inputs.dockerfile }}
          platforms: linux/amd64
          tags: ${{ inputs.image_name }}:${{ env.IMAGE_TAG }}
          load: true
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Install k3d (pinned + checksum)
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL -o /tmp/k3d "https://github.com/k3d-io/k3d/releases/download/${K3D_VERSION}/k3d-linux-amd64"
          curl -fsSL -o /tmp/checksums.txt "https://github.com/k3d-io/k3d/releases/download/${K3D_VERSION}/checksums.txt" || \
          curl -fsSL -o /tmp/checksums.txt "https://github.com/k3d-io/k3d/releases/download/${K3D_VERSION}/sha256sum.txt"
          EXP=$(grep 'k3d-linux-amd64' /tmp/checksums.txt | head -n1 | awk '{print $1}')
          ACT=$(sha256sum /tmp/k3d | awk '{print $1}')
          test "$EXP" = "$ACT"
          install -m 0755 /tmp/k3d /usr/local/bin/k3d
          k3d version

      - name: Setup kubectl (pinned)
        uses: azure/setup-kubectl@v4
        with:
          version: ${{ inputs.kubectl_version }}

      - name: Create cluster (pinned k3s)
        run: |
          k3d cluster create "$CLUSTER" --image "$K3S_IMAGE" --agents 1 --wait --timeout 120s
          kubectl cluster-info

      - name: Wait local-path-provisioner
        shell: bash
        run: |
          set -euo pipefail
          kubectl -n kube-system rollout status deploy/local-path-provisioner --timeout=90s

      - name: Ensure hostpath-retain StorageClass
        shell: bash
        run: |
          set -euo pipefail
          if ! kubectl get sc hostpath-retain >/dev/null 2>&1; then
            kubectl apply -f .github/workflows/storageclass-hostpath-retain.yaml
          fi
          kubectl get sc

      - name: Import image into cluster
        run: k3d image import ${{ inputs.image_name }}:${{ env.IMAGE_TAG }} -c "$CLUSTER"

      - name: Apply dev secrets
        run: kubectl apply -n "$NAMESPACE" -f "${{ inputs.secrets_yaml }}"

      - name: Apply Redis, Mongo, S3
        shell: bash
        run: |
          set -euo pipefail
          apply_filtered() {
            local f="$1"
            awk '
            function emit(buf){
              if (buf == "") return
              if (buf ~ /kind:[[:space:]]*StorageClass/ && buf ~ /name:[[:space:]]*hostpath-retain/) return
              if (printed) printf("---\n")
              printf("%s", buf)
              printed=1
            }
            BEGIN { buf=""; printed=0 }
            /^---[[:space:]]*$/ { emit(buf); buf=""; next }
            { buf = buf $0 ORS }
            END { emit(buf) }
            ' "$f" | kubectl apply -n "$NAMESPACE" -f -
          }
          apply_filtered infra/k8s/mongo-depl.yaml
          kubectl apply -n "$NAMESPACE" -f infra/k8s/redis-depl.yaml
          kubectl apply -n "$NAMESPACE" -f infra/k8s/s3-depl.yaml

      - name: Wait storage (PVC Bound)
        shell: bash
        run: |
          set -euo pipefail
          TO_SEC=$(echo '${{ inputs.rollout_timeout }}' | sed 's/s$//')
          wait_pvc() {
            local name="$1"
            local deadline=$(( $(date +%s) + TO_SEC ))
            echo ">> waiting PVC/$name"
            while true; do
              if kubectl -n "$NAMESPACE" get pvc "$name" >/dev/null 2>&1; then
                phase=$(kubectl -n "$NAMESPACE" get pvc "$name" -o jsonpath='{.status.phase}')
                if [ "$phase" = "Bound" ]; then
                  echo "OK PVC/$name Bound"
                  return 0
                fi
              fi
              if [ $(date +%s) -ge $deadline ]; then
                echo "timeout PVC/$name"
                kubectl -n "$NAMESPACE" get sc,pv,pvc || true
                kubectl -n "$NAMESPACE" describe pvc "$name" || true
                kubectl -n kube-system get pods | grep local-path || true
                kubectl -n "$NAMESPACE" get events --sort-by=.lastTimestamp | tail -n 200 || true
                return 1
              fi
              sleep 2
            done
          }
          for claim in data-redis-0 data-mongo-0 s3-pvc; do
            wait_pvc "$claim"
          done

      - name: Wait deps
        shell: bash
        run: |
          set -euo pipefail
          kubectl rollout status -n "$NAMESPACE" statefulset/redis --timeout=${{ inputs.rollout_timeout }}
          kubectl rollout status -n "$NAMESPACE" statefulset/mongo --timeout=${{ inputs.rollout_timeout }}
          kubectl rollout status -n "$NAMESPACE" deployment/s3-depl --timeout=${{ inputs.rollout_timeout }}

      - name: Deploy service
        shell: bash
        run: |
          set -euo pipefail
          IMG="${{ inputs.image_name }}:${IMAGE_TAG}"
          DEP="${{ inputs.deployment_yaml }}"
          TMP="/tmp/depl.yaml"
          sed "s|image: ${{ inputs.image_name }}|image: ${IMG}|g" "$DEP" > "$TMP"
          kubectl apply -n "$NAMESPACE" -f "$TMP"

      - name: Wait for rollout
        run: kubectl rollout status -n "$NAMESPACE" deployment/${{ inputs.deployment_name }} --timeout=${{ inputs.rollout_timeout }}

      - name: Start curl pod
        run: |
          kubectl run -n "$NAMESPACE" smoke --image=curlimages/curl:8.7.1 --restart=Never -- sh -c "sleep 300"
          kubectl wait -n "$NAMESPACE" --for=condition=Ready pod/smoke --timeout=60s

      - name: Health check (with retries)
        shell: bash
        run: |
          set -euo pipefail
          URL="http://${{ inputs.service_name }}:${{ inputs.service_port }}${{ inputs.health_path }}"
          for i in {1..5}; do
            if kubectl exec -n "$NAMESPACE" smoke -- sh -c "curl -fsS $URL >/dev/null"; then
              echo "healthz OK"; exit 0
            fi
            echo "retry $i"; sleep 3
          done
          echo "healthz failed"; exit 1

      - name: Logs on failure
        if: failure()
        shell: bash
        run: |
          set -euo pipefail
          kubectl -n "$NAMESPACE" get sc,pv,pvc,pods || true
          kubectl -n "$NAMESPACE" get events --sort-by=.lastTimestamp | tail -n 200 || true
          if kubectl -n "$NAMESPACE" get deploy/${{ inputs.deployment_name }} >/dev/null 2>&1; then
            kubectl logs -n "$NAMESPACE" deploy/${{ inputs.deployment_name }} --all-containers=true --tail=-1 || true
          fi

      - name: Cleanup
        if: always()
        run: k3d cluster delete "$CLUSTER"