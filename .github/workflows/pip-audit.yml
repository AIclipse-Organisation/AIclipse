name: pip-audit

on:
  pull_request:
    branches: [ "dev", "main" ]
    paths:
      - "**/requirements*.txt"
  push:
    branches: [ "dev", "main" ]
  schedule:
    - cron: "23 3 * * 1"

permissions:
  contents: read

jobs:
  pip-audit:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service:
          - auth
          - billing
          - client
          - detector
          - gateway
          - media
          - email-worker
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: pip-audit (requirements.txt)
        uses: pypa/gh-action-pip-audit@v1.1.0
        with:
          inputs: ${{ matrix.service }}/requirements.txt
          vulnerability-service: osv

      - name: pip-audit (requirements-dev.txt)
        if: ${{ hashFiles(format('{0}/requirements-dev.txt', matrix.service)) != '' }}
        uses: pypa/gh-action-pip-audit@v1.1.0
        with:
          inputs: ${{ matrix.service }}/requirements-dev.txt
          vulnerability-service: osv
