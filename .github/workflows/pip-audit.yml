name: pip-audit

on:
  pull_request:
    branches: [ "dev", "main" ]
    paths:
      - "**/requirements*.txt"
  push:
    branches: [ "dev", "main" ]
  schedule:
    - cron: "23 3 * * 1"

permissions:
  contents: read

jobs:
  pip-audit:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service:
          - auth
          - billing
          - client
          - detector
          - gateway
          - media
          - plans
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: pip-audit
        uses: pypa/gh-action-pip-audit@v1.1.0
        with:
          inputs: |
            ${{ matrix.service }}/requirements.txt
            ${{ matrix.service }}/requirements-dev.txt
          vulnerability-service: osv
