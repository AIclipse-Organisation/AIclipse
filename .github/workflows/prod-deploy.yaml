name: prod-deploy

on:
  push:
    branches: [ftr/DevOps/61129/CDPipeline]
  workflow_dispatch: {}

concurrency:
  group: prod-deploy
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

env:
  REG: ghcr.io/AIclipse-Organisation

jobs:
  build:
    runs-on: [self-hosted, prod, k8s]
    strategy:
      fail-fast: false
      matrix:
        svc:
          - { name: auth,     context: auth,     dockerfile: auth/Dockerfile }
          - { name: gateway,  context: gateway,  dockerfile: gateway/Dockerfile }
          - { name: media,    context: media,    dockerfile: media/Dockerfile }
          - { name: jobs,     context: jobs,     dockerfile: jobs/Dockerfile }
          - { name: detector, context: detector, dockerfile: detector/Dockerfile }
          - { name: plans,    context: plans,    dockerfile: plans/Dockerfile }
          - { name: billing,  context: billing,  dockerfile: billing/Dockerfile }
          - { name: client,   context: client,   dockerfile: client/Dockerfile }
          - { name: observer, context: observer, dockerfile: observer/Dockerfile }

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        run: |
          echo "${{ secrets.GHCR_TOKEN }}" | docker login ghcr.io -u "${{ secrets.GHCR_USERNAME }}" --password-stdin

      - name: Build & push ${{ matrix.svc.name }}
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.svc.context }}
          file: ${{ matrix.svc.dockerfile }}
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.REG }}/aiclipse/${{ matrix.svc.name }}:${{ github.sha }}
            ${{ env.REG }}/aiclipse/${{ matrix.svc.name }}:latest

  deploy:
    needs: build
    runs-on: [self-hosted, prod, k3s]
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Apply StorageClass
        run: |
          set -euo pipefail
          kubectl get sc hostpath-retain >/dev/null 2>&1 || \
            kubectl -n default apply -f infra/storageclass-hostpath-retain.yaml
          kubectl get sc

      - name: Ensure GHCR imagePullSecret
        env:
          GHCR_USERNAME: ${{ secrets.GHCR_USERNAME }}
          GHCR_TOKEN:    ${{ secrets.GHCR_TOKEN }}
        run: |
          set -euo pipefail
          kubectl -n default delete secret ghcr-creds >/dev/null 2>&1 || true
          kubectl -n default create secret docker-registry ghcr-creds \
            --docker-server=ghcr.io \
            --docker-username="$GHCR_USERNAME" \
            --docker-password="$GHCR_TOKEN"
          kubectl -n default patch serviceaccount default \
            -p '{"imagePullSecrets":[{"name":"ghcr-creds"}]}' >/dev/null

      - name: Ensure secrets
        env:
          MONGO_INITDB_ROOT_USERNAME: ${{ secrets.MONGO_INITDB_ROOT_USERNAME }}
          MONGO_INITDB_ROOT_PASSWORD: ${{ secrets.MONGO_INITDB_ROOT_PASSWORD }}
          MONGO_DB: ${{ secrets.MONGO_DB }}
          MONGO_URI: ${{ secrets.MONGO_URI }}
          REDIS_PASSWORD: ${{ secrets.REDIS_PASSWORD }}
          REDIS_HOST: ${{ secrets.REDIS_HOST }}
          REDIS_PORT: ${{ secrets.REDIS_PORT }}
          REDIS_URI: ${{ secrets.REDIS_URI }}
          MINIO_ROOT_USER: ${{ secrets.MINIO_ROOT_USER }}
          MINIO_ROOT_PASSWORD: ${{ secrets.MINIO_ROOT_PASSWORD }}
          S3_ENDPOINT: ${{ secrets.S3_ENDPOINT }}
          S3_PUBLIC_ENDPOINT: ${{ secrets.S3_PUBLIC_ENDPOINT }}
          JWT_KEY: ${{ secrets.JWT_KEY }}
        run: |
          set -euo pipefail
          kubectl -n default create secret generic mongo-sec \
            --from-literal=MONGO_INITDB_ROOT_USERNAME="$MONGO_INITDB_ROOT_USERNAME" \
            --from-literal=MONGO_INITDB_ROOT_PASSWORD="$MONGO_INITDB_ROOT_PASSWORD" \
            --from-literal=MONGO_DB="$MONGO_DB" \
            --from-literal=MONGO_URI="$MONGO_URI" \
            --dry-run=client -o yaml | kubectl apply -f -
          kubectl -n default create secret generic redis-sec \
            --from-literal=REDIS_PASSWORD="$REDIS_PASSWORD" \
            --from-literal=REDIS_HOST="$REDIS_HOST" \
            --from-literal=REDIS_PORT="$REDIS_PORT" \
            --from-literal=REDIS_URI="$REDIS_URI" \
            --dry-run=client -o yaml | kubectl apply -f -
          kubectl -n default create secret generic s3-sec \
            --from-literal=MINIO_ROOT_USER="$MINIO_ROOT_USER" \
            --from-literal=MINIO_ROOT_PASSWORD="$MINIO_ROOT_PASSWORD" \
            --from-literal=S3_ENDPOINT="$S3_ENDPOINT" \
            --from-literal=S3_PUBLIC_ENDPOINT="$S3_PUBLIC_ENDPOINT" \
            --dry-run=client -o yaml | kubectl apply -f -
          kubectl -n default create secret generic jwt-sec \
            --from-literal=JWT_KEY="$JWT_KEY" \
            --dry-run=client -o yaml | kubectl apply -f -

      - name: Apply data layer (filter SC)
        shell: bash
        run: |
          set -euo pipefail
          apply_filtered() {
            local f="$1"
            awk '
            function emit(buf){
              if (buf == "") return
              if (buf ~ /kind:[[:space:]]*StorageClass/ && buf ~ /name:[[:space:]]*hostpath-retain/) return
              if (printed) printf("---\n")
              printf("%s", buf); printed=1
            }
            BEGIN { buf=""; printed=0 }
            /^---[[:space:]]*$/ { emit(buf); buf=""; next }
            { buf = buf $0 ORS }
            END { emit(buf) }
            ' "$f" | kubectl -n default apply -f -
          }
          apply_filtered infra/k8s/mongo-depl.yaml
          apply_filtered infra/k8s/redis-depl.yaml
          apply_filtered infra/k8s/s3-depl.yaml

      - name: Wait statefuls
        run: |
          kubectl -n default rollout status statefulset/mongo  --timeout=300s
          kubectl -n default rollout status statefulset/redis  --timeout=300s
          kubectl -n default rollout status deploy/s3-depl     --timeout=300s

      - name: Apply app services
        run: |
          kubectl -n default apply -f infra/k8s/auth-depl.yaml
          kubectl -n default apply -f infra/k8s/gateway-depl.yaml
          kubectl -n default apply -f infra/k8s/media-depl.yaml
          kubectl -n default apply -f infra/k8s/jobs-depl.yaml
          kubectl -n default apply -f infra/k8s/detector-depl.yaml
          kubectl -n default apply -f infra/k8s/plans-depl.yaml
          kubectl -n default apply -f infra/k8s/billing-depl.yaml
          kubectl -n default apply -f infra/k8s/observer-depl.yaml
          kubectl -n default apply -f infra/k8s/client-depl.yaml

      - name: Point deployments to new images
        env:
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          kubectl -n default set image deploy/auth-depl     auth=${REG}/aiclipse/auth:${SHA}
          kubectl -n default set image deploy/gateway-depl  gateway=${REG}/aiclipse/gateway:${SHA}
          kubectl -n default set image deploy/media-depl    media=${REG}/aiclipse/media:${SHA}
          kubectl -n default set image deploy/jobs-depl     jobs=${REG}/aiclipse/jobs:${SHA}
          kubectl -n default set image deploy/detector-depl detector=${REG}/aiclipse/detector:${SHA}
          kubectl -n default set image deploy/plans-depl    plans=${REG}/aiclipse/plans:${SHA}
          kubectl -n default set image deploy/billing-depl  billing=${REG}/aiclipse/billing:${SHA}
          kubectl -n default set image deploy/observer-depl observer=${REG}/aiclipse/observer:${SHA}
          kubectl -n default set image deploy/client-depl   client=${REG}/aiclipse/client:${SHA}

      - name: Wait core rollouts
        run: |
          kubectl -n default rollout status deploy/gateway-depl --timeout=300s
          kubectl -n default rollout status deploy/client-depl  --timeout=300s

      - name: Apply prod ingress
        run: kubectl -n default apply -f infra/k8s-prod/ingress-srv.yaml

      - name: Smoke test
        run: |
          set -e
          curl -sS -I https://aiclipse.online | head -n1
          curl -sS -I https://storage.aiclipse.online | head -n1 || true
