name: tests-client

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'client/**'
      - 'infra/k8s/client-depl.yaml'
      - 'infra/k8s-dev/dev-secrets.yaml'
      - 'infra/kustomization.yaml'
      - 'skaffold.yaml'

concurrency:
  group: tests-client-${{ github.ref }}
  cancel-in-progress: true

jobs:
  client:
    uses: ./.github/workflows/k3d-smoke.yml
    with:
      svc_name: client
      context: ./client
      dockerfile: client/Dockerfile
      image_name: aiclipse/client
      deployment_yaml: infra/k8s/client-depl.yaml
      deployment_name: client-depl
      container_name: client
      service_name: client-srv
      service_port: 3000
      health_path: /healthz
      secrets_yaml: infra/k8s-dev/dev-secrets.yaml
      readiness_selector: app=client
      extra_manifests: |
      #   infra/k8s/mongo-depl.yaml
      #   infra/k8s/redis-depl.yaml
      #   infra/k8s/s3-depl.yaml
