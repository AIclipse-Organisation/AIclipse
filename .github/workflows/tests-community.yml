name: tests-community

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'community/**'
      - 'infra/k8s/community-depl.yaml'
      - 'infra/k8s-dev/dev-secrets.yaml'
      - 'infra/kustomization.yaml'
      - 'skaffold.yaml'

concurrency:
  group: tests-community-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    name: unit-tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: community
    steps:
      - uses: actions/checkout@v4

      # - name: Setup Python
      #   uses: actions/setup-python@v5
      #   with:
      #     python-version: "3.11"
      #     cache: "pip"
      #     cache-dependency-path: |
      #       community/requirements.txt
      #       community/requirements-dev.txt

      # - name: Install deps
      #   run: |
      #     set -euo pipefail
      #     python -m pip install -U pip
      #     pip install -r requirements-dev.txt

      # - name: Run pytest
      #   run: |
      #     set -euo pipefail
      #     python -m pytest tests -q

  community:
    name: k3d-smoke
    needs: unit
    uses: ./.github/workflows/k3d-smoke.yml
    with:
      svc_name: community
      context: ./community
      dockerfile: community/Dockerfile
      image_name: aiclipse/community
      deployment_yaml: infra/k8s/community-depl.yaml
      deployment_name: community-depl
      container_name: community
      service_name: community-srv
      service_port: 3000
      health_path: /community/healthz
      secrets_yaml: infra/k8s-dev/dev-secrets.yaml
      readiness_selector: app=community
