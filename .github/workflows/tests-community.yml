name: tests-community

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'community/**'
      - 'infra/k8s/community-depl.yaml'
      - 'infra/k8s-dev/dev-secrets.yaml'
      - 'infra/kustomization.yaml'
      - 'skaffold.yaml'
  push:
    branches: [dev, main]
    paths:
      - 'community/**'
      - 'infra/k8s/community-depl.yaml'
      - 'infra/k8s-dev/dev-secrets.yaml'
      - 'infra/kustomization.yaml'
      - 'skaffold.yaml'

concurrency:
  group: tests-community-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  unit:
    name: unit-tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: community
    steps:
      - uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: community/package-lock.json

      - name: Install deps
        run: npm ci

      - name: Run node --test
        run: npm test

  community:
    name: k3d-smoke
    needs: unit
    uses: ./.github/workflows/k3d-smoke.yml
    with:
      svc_name: community
      context: ./community
      dockerfile: community/Dockerfile
      image_name: aiclipse/community
      deployment_yaml: infra/k8s/community-depl.yaml
      deployment_name: community-depl
      container_name: community
      service_name: community-srv
      service_port: 3000
      health_path: /community/healthz
      secrets_yaml: infra/k8s-dev/dev-secrets.yaml
      readiness_selector: app=community
