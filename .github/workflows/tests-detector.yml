name: tests-detector

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'detector/**'
      - 'infra/k8s/detector-depl.yaml'
      - 'infra/k8s-dev/dev-secrets.yaml'
      - 'infra/kustomization.yaml'
      - 'skaffold.yaml'

concurrency:
  group: tests-detector-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    name: unit-tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: detector
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: |
            detector/requirements.txt
            detector/requirements-dev.txt

      - name: Install deps
        run: |
          set -euo pipefail
          python -m pip install -U pip
          pip install -r requirements-dev.txt

      - name: Run pytest
        run: |
          set -euo pipefail
          python -m pytest tests -q

