name: tests-jobs

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'jobs/**'
      - 'infra/k8s/jobs-depl.yaml'
      - 'infra/k8s-dev/dev-secrets.yaml'
      - 'infra/kustomization.yaml'
      - 'skaffold.yaml'

concurrency:
  group: tests-jobs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  jobs:
    uses: ./.github/workflows/k3d-smoke.yml
    with:
      svc_name: jobs
      context: ./jobs
      dockerfile: jobs/Dockerfile
      image_name: aiclipse/jobs
      deployment_yaml: infra/k8s/jobs-depl.yaml
      deployment_name: jobs-depl
      container_name: jobs
      service_name: jobs-srv
      service_port: 3000
      health_path: /healthz
      secrets_yaml: infra/k8s-dev/dev-secrets.yaml
      readiness_selector: app=jobs
      extra_manifests: |
        infra/k8s/mongo-depl.yaml
        infra/k8s/redis-depl.yaml
      #   infra/k8s/s3-depl.yaml
