name: tests-model-cycle

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'model-cycle/**'
      - 'infra/k8s/model-cycle-depl.yaml'
      - 'infra/k8s/model-cycle-pvc.yaml'
      - 'infra/k8s-dev/model-cycle-secrets.yaml'
      - 'infra/k8s-dev/dev-secrets.yaml'
      - 'infra/kustomization.yaml'
      - 'skaffold.yaml'
  push:
    branches: [dev, main]
    paths:
      - 'model-cycle/**'
      - 'infra/k8s/model-cycle-depl.yaml'
      - 'infra/k8s/model-cycle-pvc.yaml'
      - 'infra/k8s-dev/model-cycle-secrets.yaml'
      - 'infra/k8s-dev/dev-secrets.yaml'
      - 'infra/kustomization.yaml'
      - 'skaffold.yaml'

concurrency:
  group: tests-model-cycle-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  unit:
    name: unit-tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: model-cycle
    steps:
      - uses: actions/checkout@v6

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "8.0.x"

      - name: Restore
        run: dotnet restore Tests/Tests.csproj

      - name: Run xUnit tests
        run: dotnet test Tests/Tests.csproj --no-restore --verbosity minimal

  model-cycle:
    name: k3d-smoke
    needs: unit
    uses: ./.github/workflows/k3d-smoke.yml
    with:
      svc_name: model-cycle
      context: ./model-cycle
      dockerfile: model-cycle/Dockerfile
      image_name: aiclipse/model-cycle
      deployment_yaml: infra/k8s/model-cycle-depl.yaml
      deployment_name: model-cycle-depl
      container_name: model-cycle
      service_name: model-cycle-srv
      service_port: 3000
      health_path: /healthz
      secrets_yaml: infra/k8s-dev/dev-secrets.yaml
      extra_secrets_yaml: infra/k8s-dev/model-cycle-secrets.yaml
      extra_pvc_yaml: infra/k8s/model-cycle-pvc.yaml
      extra_pvc_name: model-cycle-pvc
      readiness_selector: app=model-cycle
