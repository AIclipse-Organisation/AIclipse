<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <title>AICLIPSE</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="stylesheet" href="/static/css/styles.css" />
  <link rel="stylesheet" href="/static/css/upload.css" />
</head>

<body>

  <body class="app">
    <div class="app-container">
      <div data-include="/static/partials/topbar.html"></div>
      <main class="screen">
        <div class="grid">
          <section class="page-header" aria-label="Page title">
            <h1 id="page-title" class="page-title">Upload</h1>
            <div class="page-underline" role="presentation"></div>
          </section>

            <input id="file-input" type="file" accept="image/*" hidden />

            <label for="file-input" class="file-upload">
              Upload image to scan
            </label>

            <span id="check-state" class="muted">Select an image to analyze.</span>

            <button id="btn-check" disabled>Analyze Results</button>

        </div>
      </main>

      <div data-include="/static/partials/navbar.html"></div>
    </div>

    <script src="/static/js/include.js"></script>
    <script src="/static/js/app.js"></script>
    <script src="/static/js/imageProcessing.js"></script>
    <script src="/static/js/main.js"></script>
  </body>

</html>
