<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>AIclipse</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="stylesheet" href="/static/css/styles.css" />
    <link rel="stylesheet" href="/static/css/upload.css" />
  </head>

  <body class="app">
    <div class="app-container">
      {% include 'partials/topbar.html' %}

      <main class="screen upload-screen">
        <section class="page-header" aria-label="Page title">
          <h1 id="page-title" class="page-title">Upload</h1>
          <div class="page-underline" role="presentation"></div>
        </section>

        <!-- PREVIEW AREA (flex grows) -->
        <div class="upload-content">
          <div class="upload-previewWrap" hidden id="upload-preview-wrap">
            <div class="results-imageFrame" id="upload-frame">
              <img
                id="preview-image"
                alt="Selected image preview"
                draggable="false"
              />
              <div class="crop-hint" id="crop-hint">Drag to reposition</div>
            </div>

            <button type="button" class="btn-crop-reset" id="btn-crop-reset">
              Reset crop
            </button>
          </div>
        </div>

        <div class="upload-actions">
          <input id="file-input" type="file" accept="image/*" hidden />

          <label for="file-input" class="file-upload">
            Choose Image
          </label>

          <span id="check-state" class="muted">
            Select an image to analyze.
          </span>

          <button id="btn-check" disabled hidden>Scan Image</button>
        </div>
      </main>

      {% include 'partials/navbar.html' %}
    </div>

    <script src="/static/js/include.js"></script>
    <script src="/static/js/app.js"></script>
    <script src="/static/js/imageProcessing.js"></script>
    <script src="/static/js/main.js"></script>
  </body>
</html>
