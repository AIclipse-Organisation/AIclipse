<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>AICLIPSE</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="/static/styles.css">
</head>
<body>
  <header>
    <h1>AICLIPSE</h1>
    <div id="current-user-chip" class="badge muted">
      Not signed in
    </div>
  </header>

  <main>
    <div class="grid">
      <!-- Signup / Login -->
      <section class="card">
        <h2>Account</h2>

        <div>
          <label for="signup-username">Username</label>
          <input id="signup-username" type="text" autocomplete="username">

          <label for="signup-email">Email</label>
          <input id="signup-email" type="email" autocomplete="email">

          <label for="signup-password">Password</label>
          <input id="signup-password" type="password" autocomplete="new-password">

          <button id="btn-signup">Sign up</button>
        </div>

        <hr class="divider">

        <div>
          <label for="login-email">Email</label>
          <input id="login-email" type="email" autocomplete="email">

          <label for="login-password">Password</label>
          <input id="login-password" type="password" autocomplete="current-password">

          <button id="btn-login">Log in</button>
          <button id="btn-logout" class="secondary">Log out</button>
          <button id="btn-me" class="secondary">Refresh profile</button>
        </div>

        <div id="account-status" class="status-bar"></div>
      </section>

      <!-- Detection -->
      <section class="card">
        <h2>Detect</h2>

        <label for="file-input">Image file (JPEG/PNG)</label>
        <input id="file-input" type="file" accept="image/*">

        <div class="row">
          <button id="btn-check" disabled>Analyze image</button>
          <span id="check-state" class="muted">Select a file to enable detection.</span>
        </div>

        <div class="row margin-top-8">
          <input id="checkbox-public" type="checkbox">
          <label for="checkbox-public" class="muted no-margin">
            Save as public (community)
          </label>
        </div>

        <div class="row margin-top-8">
          <button id="btn-save" disabled>Save image with result</button>
        </div>

        <div id="detect-status" class="status-bar"></div>

        <h3 class="subheading">Last detection</h3>
        <pre id="detect-result">No detection yet.</pre>
      </section>
    </div>

    <div class="grid">
      <!-- My images -->
      <section class="card">
        <h2>My images</h2>
        <div class="row">
          <button id="btn-my-images">Load my images</button>
          <select id="my-images-filter">
            <option value="">All</option>
            <option value="true">Only public</option>
            <option value="false">Only private</option>
          </select>
        </div>
        <div id="my-images-status" class="status-bar"></div>
        <div id="my-images-list" class="images-list"></div>
      </section>

      <!-- Community images -->
      <section class="card">
        <h2>Community</h2>
        <div class="row">
          <button id="btn-community-images">Load community images</button>
        </div>
        <div id="community-images-status" class="status-bar"></div>
        <div id="community-images-list" class="images-list"></div>
      </section>
    </div>

    <section class="card">
      <h2>Raw responses</h2>
      <p class="muted">
        Debug view. Last JSON response from the server:
      </p>
      <pre id="debug-output">{}</pre>
    </section>
  </main>

  <script src="/static/app.js"></script>
</body>
</html>
