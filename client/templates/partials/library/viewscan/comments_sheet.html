<div id="comments-backdrop" class="comm_sheetBackdrop" hidden></div>
<div id="comments-sheet" class="comm_bottomSheet" role="dialog" aria-modal="true" aria-label="Comments">
  <div id="comments-handle" class="comm_sheetHandleWrap">
    <div class="comm_sheetHandle"></div>
  </div>

  <div class="comm_sheetHeader">
    <div class="comm_sheetHeaderTitle">Comments</div>
    <button id="comments-close" class="comm_sheetCloseBtn" aria-label="Close comments">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
        stroke-linecap="round" stroke-linejoin="round">
        <line x1="18" y1="6" x2="6" y2="18" />
        <line x1="6" y1="6" x2="18" y2="18" />
      </svg>
    </button>
  </div>

  <div id="comments-body" class="comm_sheetBody">
    <div id="comments-list" class="comm_commentsList"></div>
  </div>

  <div class="comm_sheetFooter">
    <div class="comm_sheetInputWrapper">
      <input id="comments-input" class="comm_sheetInput" type="text" placeholder="Add a comment..." maxlength="500" />
      <button id="comments-post" class="comm_sheetPostBtn" type="button" disabled>
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"
          stroke-linecap="round" stroke-linejoin="round">
          <line x1="22" y1="2" x2="11" y2="13" />
          <polygon points="22 2 15 22 11 13 2 9 22 2" />
        </svg>
      </button>
    </div>
  </div>
</div>
