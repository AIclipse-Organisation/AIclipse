<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <title>AICLIPSE</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="stylesheet" href="/static/css/styles.css" />
  <link rel="stylesheet" href="/static/css/profile.css" />
</head>

<body class="app">
  <div class="app-container">
    <div data-include="/static/partials/topbar.html"></div>

    <main class="screen">
      <section class="page-header" aria-label="Page title">
        <h1 id="page-title" class="page-title">Profile</h1>
        <div class="page-underline" role="presentation"></div>
      </section>

      <!-- PROFILE SUMMARY (top) -->
      <section class="profile-summary" aria-label="Profile summary">
        <div class="profile-summary-left">
          <!-- Avatar (image) -->
          <div class="profile-avatar">
            <img
              src="/static/images/profile.png"
              alt="Profile"
              class="profile-avatar-img"
            />
          </div>

          <div class="profile-identity">
            <div id="detail-username" class="profile-username">-</div>
            <div id="detail-email" class="profile-email">-</div>

            <!-- Plan BELOW name/email -->
            <div class="profile-plan">
              <span class="meta-label">Plan</span>
              <span id="detail-plan" class="meta-value">-</span>
            </div>
          </div>
        </div>

        <!-- Right side: member since + monthly usage (LEFT ALIGNED) -->
        <div class="profile-summary-right profile-stats-left">
          <div class="profile-meta">
            <span class="meta-label">Member Since</span>
            <span id="detail-created" class="meta-value">-</span>
          </div>

          <div class="profile-meta">
            <span class="meta-label">Monthly Usage</span>
            <span id="detail-monthly-usage" class="meta-value">-</span>
          </div>
        </div>
      </section>

      <!-- STATUS -->
      <div id="user-details-status" class="status-message"></div>

      <!-- DETAILS (below profile section) -->
      <section class="user-details-section" aria-label="User stats">
        <h2>Details</h2>

        <div id="user-details-container" class="user-details-container" style="display:none;">
          <div class="user-detail-item">
            <span class="detail-label">Total Guesses:</span>
            <span id="detail-total-guesses" class="detail-value">-</span>
          </div>

          <div class="user-detail-item">
            <span class="detail-label">Total Correct:</span>
            <span id="detail-total-correct" class="detail-value">-</span>
          </div>

          <div class="user-detail-item">
            <span class="detail-label">AI Detection Accuracy:</span>
            <span id="detail-acc-ai" class="detail-value">-</span>
          </div>

          <div class="user-detail-item">
            <span class="detail-label">Real Detection Accuracy:</span>
            <span id="detail-acc-real" class="detail-value">-</span>
          </div>
        </div>
      </section>

      <!-- LOGOUT (bottom) -->
      <div class="profile-footer">
        <button id="btn-logout" class="secondary logout-btn">Log out</button>
      </div>
    </main>

    <div data-include="/static/partials/navbar.html"></div>
  </div>

  <script src="/static/js/include.js"></script>
  <script src="/static/js/app.js"></script>
  <script src="/static/js/main.js"></script>
  <script src="/static/js/profile.js"></script>
</body>

</html>
