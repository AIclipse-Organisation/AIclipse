<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>AIclipse</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="stylesheet" href="/static/css/styles.css" />
    <link rel="stylesheet" href="/static/css/upload.css" />
    <link rel="stylesheet" href="/static/css/loader.css" />
  </head>

  <body class="app">
    <div class="app-container">
      {% set page_title = 'Results' %} {% include 'partials/topbar.html' %}
      <main class="screen">
        <div class="grid">
          <div class="results-imageFrame">
            <img id="preview-image" alt="Selected image preview" />
          </div>

          <div id="detect-card" class="detection-card" aria-live="polite">
            <div class="detection-row">
              <div class="detection-main">
                <div class="comm_barBlock is-hidden aiclipse-bar-card" id="aiclipse-bar-block">
                  <div class="comm_barHead">
                    <div class="comm_barHeadBrand" aria-hidden="true">
                      <div class="comm_resultAvatar">
                        <img src="/static/images/aiclipse_moon.png" alt="" class="comm_resultIcon" />
                      </div>
                      <span class="comm_barBrandText">AICLIPSE</span>
                    </div>
                  </div>

                  <div class="comm_barTrackWrap">
                    <span class="comm_zoneLabel comm_zoneLabel--safe" style="left: 20%">Real</span>
                    <span class="comm_zoneLabel comm_zoneLabel--neutral" style="left: 50%">Suspicious</span>
                    <span class="comm_zoneLabel comm_zoneLabel--risk" style="left: 80%">Fake</span>

                    <div class="comm_progressPanel" aria-hidden="true" title="AI probability">
                      <div class="comm_progressBar">
                        <div class="comm_progressFill" id="ai-fill" data-p="0" style="width: 0px"></div>
                        <div class="comm_barMarker" style="left: 40%"></div>
                        <div class="comm_barMarker" style="left: 60%"></div>
                        <span class="comm_barPercent" id="ai-percent">0%</span>
                      </div>
                    </div>
                  </div>
                </div>

                <p id="detect-verdict" class="verdict-text label-neutral" hidden>—</p>

                <input id="save-public" type="checkbox" hidden />

                <div id="public-desc-wrap" class="publish-extra" hidden>
                  <label for="post-description" class="publish-label">
                    Community Description
                  </label>
                  <textarea
                    id="post-description"
                    rows="3"
                    placeholder="What should the community know about this scan?"
                    class="publish-textarea"
                  ></textarea>
                </div>
                <div class="action-row">
                  <div class="visibility-selector">
                    <button
                      type="button"
                      class="vis-btn is-selected"
                      id="mode-private"
                    >
                      <img src="/static/images/lock.png" class="icon" alt="" />
                      Private
                    </button>

                    <button type="button" class="vis-btn" id="mode-public">
                      <img
                        src="/static/images/icons8-community-100.png"
                        class="icon"
                        alt=""
                      />
                      Public
                    </button>
                  </div>

                  <button
                    id="btn-save"
                    disabled
                    type="button"
                    class="btn-save-final"
                  >
                    Save
                  </button>
                </div>

                <div class="danger-zone">
                  <button id="btn-delete" class="btn-delete-link" type="button">
                    Delete this scan
                  </button>
                </div>

                <div id="delete-modal" class="modal-overlay" hidden>
                  <div class="modal">
                    <h3 class="modal-title">Delete scan?</h3>
                    <p class="modal-text">This action cannot be undone.</p>
                    <div class="modal-actions">
                      <button
                        id="cancel-delete"
                        class="secondary"
                        type="button"
                      >
                        Cancel
                      </button>
                      <button id="confirm-delete" class="danger" type="button">
                        Delete
                      </button>
                    </div>
                  </div>
                </div>
              </div>
            </div>
          </div>
        </div>
      </main>

      {% include 'partials/navbar.html' %}
    </div>

    <script src="/static/js/include.js"></script>
    <script src="/static/js/app.js"></script>
    <script src="/static/js/upload.js"></script>
    <script src="/static/js/results.js"></script>
    <script src="/static/js/main.js"></script>
    <script src="/static/js/loader.js"></script>
  </body>
</html>
