<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>AIclipse</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="stylesheet" href="/static/css/styles.css" />
    <link rel="stylesheet" href="/static/css/upload.css" />
  </head>

  <body class="app">
    <div class="app-container">
      {% include 'partials/topbar.html' %}
      <main class="screen">
        <div class="grid">
          <section class="page-header" aria-label="Page title">
            <h1 class="page-title">Results</h1>
            <div class="page-underline" role="presentation"></div>
          </section>

          <!-- <button type="button" class="btn-results-back" id="btn-back">
            Back to upload
          </button> -->

          <div class="results-imageFrame">
            <img id="preview-image" alt="Selected image preview" />
          </div>

          <div id="detect-card" class="detection-card" aria-live="polite">
            <div class="detection-row">
              <div class="detection-main">
                <div class="bar-head">
                  <span class="bar-title">Aiclipse</span>
                  <p id="detect-verdict" class="verdict-text label-neutral">
                    —
                  </p>
                </div>

                <div
                  class="progress-panel"
                  aria-hidden="true"
                  title="Real probability"
                >
                  <div class="progress-bar">
                    <div class="real-fill" style="--p: 0"></div>
                    <div class="ai-fill" style="--p: 0"></div>

                    <span class="bar-percent" id="real-percent">0%</span>
                  </div>
                </div>

                <input id="save-public" type="checkbox" hidden />

                <div id="public-desc-wrap" class="publish-extra" hidden>
                  <label for="post-description" class="publish-label"
                    >Community Description</label
                  >
                  <textarea
                    id="post-description"
                    rows="3"
                    placeholder="What should the community know about this scan?"
                    class="publish-textarea"
                  ></textarea>
                </div>
                <div class="action-row">
                  <div class="visibility-selector">
                  <button
                    type="button"
                    class="vis-btn is-selected"
                    id="mode-private"
                  >
                    <image src="/static/images/lock.png" class="icon"></image>
                    Private
                  </button>
                  <button type="button" class="vis-btn" id="mode-public">
                    <image
                      src="/static/images/icons8-community-100.png"
                      class="icon"
                    ></image>
                    Public
                  </button>
                </div>
                  <button
                    id="btn-save"
                    disabled
                    type="button"
                    class="btn-save-final"
                  >
                    Confirm & Save
                  </button>
                </div>
                </div>

                

                <input id="save-public" type="checkbox" hidden />
                <div id="public-desc-wrap" class="publish-extra" hidden>
                  <label for="post-description" class="publish-label"
                    >Community Description</label
                  >
                  <textarea
                    id="post-description"
                    rows="3"
                    placeholder="What should the community know?"
                    class="publish-textarea"
                  ></textarea>
                </div>

                <div class="danger-zone">
                  <button id="btn-delete" class="btn-delete-link" type="button">
                    Delete this scan
                  </button>
                </div>
                <div id="delete-modal" class="modal-overlay" hidden>
                  <div class="modal">
                    <h3 class="modal-title">Delete scan?</h3>
                    <p class="modal-text">This action cannot be undone.</p>
                    <div class="modal-actions">
                      <button
                        id="cancel-delete"
                        class="secondary"
                        type="button"
                      >
                        Cancel
                      </button>
                      <button id="confirm-delete" class="danger" type="button">
                        Delete
                      </button>
                    </div>
                  </div>
                </div>
              </div>
            </div>
          </div>
        </div>

        <!-- <section class="card">
                <h2>Raw responses</h2>
                <p class="muted">Debug view. Last JSON response from the server:</p>
                <pre id="debug-output">{}</pre>
            </section> -->
      </main>

      {% include 'partials/navbar.html' %}
    </div>

    <script src="/static/js/include.js"></script>
    <script src="/static/js/app.js"></script>
    <script src="/static/js/upload.js"></script>
    <script src="/static/js/results.js"></script>
    <script src="/static/js/main.js"></script>
  </body>
</html>
