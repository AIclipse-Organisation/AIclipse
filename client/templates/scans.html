<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <title>Scans</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="stylesheet" href="/static/css/styles.css" />
  <link rel="stylesheet" href="/static/css/scans.css" />
</head>

<body class="app">
  <div class="app-container">
    <div data-include="/static/partials/topbar.html"></div>

    <main class="screen">
      <section class="page-header" aria-label="Page title">
        <h1 id="page-title" class="page-title">Scans</h1>
        <div class="page-underline" role="presentation"></div>
      </section>

      <nav class="scans-tabs" aria-label="Scan filters">
        <button type="button" class="scans-tab is-active" data-filter="private" aria-selected="true">
          Private
        </button>
        <button type="button" class="scans-tab" data-filter="public" aria-selected="false">
          Public
        </button>
      </nav>

      <div id="scans-status" class="status-message"></div>
      <div id="scans-container" class="scans-grid"></div>
    </main>

    <div data-include="/static/partials/navbar.html"></div>
  </div>

  <!-- Modal for making image public -->
  <div id="make-public-modal" class="modal" style="display: none;">
    <div class="modal-content">
      <h2>Make Image Public</h2>
      <p>Add a description for your post (required, max 1000 characters):</p>
      <textarea id="public-description-input" maxlength="1000" rows="4" placeholder="Describe your image..."></textarea>
      <div class="char-count"><span id="char-counter">0</span>/1000</div>
      <div id="modal-status" class="status-message"></div>
      <div class="modal-buttons">
        <button type="button" id="modal-cancel" class="btn-secondary">Cancel</button>
        <button type="button" id="modal-publish" class="btn-primary">Publish</button>
      </div>
    </div>
  </div>

  <script src="/static/js/include.js"></script>
  <script src="/static/js/app.js"></script>
  <script src="/static/js/main.js"></script>
  <script src="/static/js/scans.js"></script>
</body>

</html>
