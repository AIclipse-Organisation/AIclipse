<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Algorithm Demo</title>
    <link rel="stylesheet" href="styles/main.css" />
  </head>
  <body>
    <div class="top-container">
      <h1>Algorithm Demo</h1>
    </div>

    <div class="main-conatainer">
      <div class="data-column">
        <h2>Images</h2>
        <pre id="images-data-box">Loading...</pre>
      </div>
      <div class="data-column">
        <h2>Posts</h2>
        <pre id="posts-data-box">Loading...</pre>
      </div>
      <div class="data-column">
        <h2>Comments</h2>
        <pre id="comments-data-box">Loading...</pre>
      </div>
    </div>

    <div class="basic-info-container">
      <h3>Basic info</h3>
      <button id="openPdfBtn">Open PDF for more details</button>
    </div>

    <div class="calculations-container">
      <h1>Calculations</h1>

      <h3>Step 1: Post normalisation</h3>

      <div class="calculation-avg-box">
        <div id="summary-box" class="avg-summary-box"></div>
        <div id="normalized-box" class="normalized-summary-box"></div>
      </div>
    
    </div>
    <script src="js/calculations.js"></script>
    <script src="js/setup.js"></script>
  </body>
</html>
