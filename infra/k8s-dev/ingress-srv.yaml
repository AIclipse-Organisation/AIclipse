apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: ingress-srv
  annotations:
    kubernetes.io/ingress.class: nginx
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
spec:
  rules:
    - host: aiclipse.dev
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service: { name: gateway-srv, port: { number: 8080 } }
          - path: /
            pathType: Prefix
            backend:
              service: { name: client-srv, port: { number: 3000 } }
    - host: storage.aiclipse.dev
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service: { name: s3-srv, port: { number: 9000 } }
