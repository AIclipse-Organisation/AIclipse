apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: ingress-srv
  annotations:
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-body-size: "20m"
    nginx.ingress.kubernetes.io/proxy-buffering: "off"
spec:
  ingressClassName: nginx
  rules:
    - host: aiclipse.online
      http:
        paths:

          # These Next.js paths are requested from root (not /community).
          # Send them to community-srv so they do not hit / and 404.
          - path: /__nextjs_original-stack-frames
            pathType: Prefix
            backend:
              service:
                name: community-srv
                port:
                  number: 3000
          - path: /__nextjs_font
            pathType: Prefix
            backend:
              service:
                name: community-srv
                port:
                  number: 3000
          - path: /_nextjs_original-stack-frames
            pathType: Prefix
            backend:
              service:
                name: community-srv
                port:
                  number: 3000
          - path: /_nextjs_font
            pathType: Prefix
            backend:
              service:
                name: community-srv
                port:
                  number: 3000
          - path: /community
            pathType: Prefix
            backend:
              service:
                name: community-srv
                port:
                  number: 3000
          - path: /
            pathType: Prefix
            backend:
              service:
                name: client-srv
                port:
                  number: 3000
    - host: storage.aiclipse.online
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: s3-srv
                port:
                  number: 9000

    - host: aiclipse.site
      http:
        paths:
          # Same fix for this host: route root Next.js helper paths to community-srv.
          # This avoids 404s from the default / route.
          - path: /__nextjs_original-stack-frames
            pathType: Prefix
            backend:
              service:
                name: community-srv
                port:
                  number: 3000
          - path: /__nextjs_font
            pathType: Prefix
            backend:
              service:
                name: community-srv
                port:
                  number: 3000
          - path: /_nextjs_original-stack-frames
            pathType: Prefix
            backend:
              service:
                name: community-srv
                port:
                  number: 3000
          - path: /_nextjs_font
            pathType: Prefix
            backend:
              service:
                name: community-srv
                port:
                  number: 3000
          - path: /community
            pathType: Prefix
            backend:
              service:
                name: community-srv
                port:
                  number: 3000
          - path: /
            pathType: Prefix
            backend:
              service:
                name: client-srv
                port:
                  number: 3000
    - host: storage.aiclipse.site
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: s3-srv
                port:
                  number: 9000
