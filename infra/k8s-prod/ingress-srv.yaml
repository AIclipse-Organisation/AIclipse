apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: ingress-srv
  annotations:
    nginx.ingress.kubernetes.io/force-ssl-redirect: "true"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-body-size: "20m"
    nginx.ingress.kubernetes.io/proxy-buffering: "on"
spec:
  ingressClassName: nginx
  rules:
    - host: aiclipse.online
      http:
        paths:
          - path: /community
            pathType: Prefix
            backend:
              service:
                name: community-srv
                port:
                  number: 3000
          - path: /
            pathType: Prefix
            backend:
              service:
                name: client-srv
                port:
                  number: 3000
    - host: storage.aiclipse.online
      http:
        paths:
          - path: /crossdomain.xml
            pathType: Exact
            backend:
              service:
                name: client-srv
                port:
                  number: 3000
          - path: /robots.txt
            pathType: Exact
            backend:
              service:
                name: client-srv
                port:
                  number: 3000
          - path: /sitemap.xml
            pathType: Exact
            backend:
              service:
                name: client-srv
                port:
                  number: 3000
          - path: /
            pathType: Prefix
            backend:
              service:
                name: s3-srv
                port:
                  number: 9000

    - host: aiclipse.site
      http:
        paths:
          - path: /community
            pathType: Prefix
            backend:
              service:
                name: community-srv
                port:
                  number: 3000
          - path: /
            pathType: Prefix
            backend:
              service:
                name: client-srv
                port:
                  number: 3000
    - host: storage.aiclipse.site
      http:
        paths:
          - path: /crossdomain.xml
            pathType: Exact
            backend:
              service:
                name: client-srv
                port:
                  number: 3000
          - path: /robots.txt
            pathType: Exact
            backend:
              service:
                name: client-srv
                port:
                  number: 3000
          - path: /sitemap.xml
            pathType: Exact
            backend:
              service:
                name: client-srv
                port:
                  number: 3000
          - path: /
            pathType: Prefix
            backend:
              service:
                name: s3-srv
                port:
                  number: 9000
