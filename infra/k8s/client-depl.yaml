apiVersion: apps/v1
kind: Deployment
metadata:
  name: client-depl
spec:
  replicas: 1
  selector:
    matchLabels: { app: client }
  template:
    metadata:
      labels: { app: client }
    spec:
      containers:
        - name: client
          image: aiclipse/client
          env:
            - name: API_BASE_URL
              value: "http://gateway-srv:8080"
          ports:
            - { name: http, containerPort: 3000 }
          readinessProbe:
            httpGet: { path: "/", port: 3000 }
            initialDelaySeconds: 5
          livenessProbe:
            httpGet: { path: "/", port: 3000 }
            initialDelaySeconds: 15
          resources:
            requests: { cpu: "25m", memory: "64Mi" }
            limits: { cpu: "200m", memory: "256Mi" }
---
apiVersion: v1
kind: Service
metadata:
  name: client-srv
spec:
  type: ClusterIP
  selector: { app: client }
  ports:
    - { name: http, port: 3000, targetPort: 3000 }
