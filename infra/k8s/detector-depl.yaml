apiVersion: apps/v1
kind: Deployment
metadata:
  name: detector-depl
spec:
  replicas: 1
  selector:
    matchLabels: { app: detector }
  template:
    metadata:
      labels: { app: detector }
    spec:
      # Wait for MinIO before starting the Detector
      initContainers:
        - name: wait-for-minio
          image: busybox
          command: ['sh', '-c', 'until nc -z s3-srv 9000; do echo detector waiting for minio; sleep 2; done;']
      containers:
        - name: detector
          image: aiclipse/detector
          ports:
            - { containerPort: 3000, name: http }
          env:
            - name: INTERNAL_AUTH_TOKEN
              valueFrom: { secretKeyRef: { name: jwt-sec, key: INTERNAL_AUTH_TOKEN } }
            - name: MONGO_URI
              valueFrom: { secretKeyRef: { name: mongo-sec, key: MONGO_URI } }
            - name: MONGO_DB
              valueFrom: { secretKeyRef: { name: mongo-sec, key: MONGO_DB } }
            - name: REDIS_URI
              valueFrom: { secretKeyRef: { name: redis-sec, key: REDIS_URI } }
            - name: S3_ENDPOINT 
              valueFrom: { secretKeyRef: { name: s3-sec, key: S3_ENDPOINT } } 
            - name: S3_PUBLIC_ENDPOINT
              valueFrom: { secretKeyRef: { name: s3-sec, key: S3_PUBLIC_ENDPOINT } } 
            - name: AWS_ACCESS_KEY_ID 
              valueFrom: { secretKeyRef: { name: s3-sec, key: MINIO_ROOT_USER } } 
            - name: AWS_SECRET_ACCESS_KEY 
              valueFrom: { secretKeyRef: { name: s3-sec, key: MINIO_ROOT_PASSWORD } }
            - name: MINIO_BUCKET_NAME
              value: "model-cycle-storage"
          readinessProbe:
            httpGet: { path: /healthz, port: 3000, scheme: HTTP }
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet: { path: /healthz, port: 3000, scheme: HTTP }
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 5
          startupProbe:
            httpGet: { path: /healthz, port: 3000, scheme: HTTP }
            periodSeconds: 5
            failureThreshold: 60
          resources:
            requests: { cpu: "250m",  memory: "1Gi" }
            limits:   { cpu: "1500m", memory: "2Gi" }

---
apiVersion: v1
kind: Service
metadata:
  name: detector-srv
spec:
  type: ClusterIP
  selector: { app: detector }
  ports:
    - { name: http, port: 3000, targetPort: 3000 }
