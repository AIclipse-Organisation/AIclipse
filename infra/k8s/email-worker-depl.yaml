apiVersion: apps/v1
kind: Deployment
metadata:
  name: email-worker-depl
spec:
  replicas: 1
  selector:
    matchLabels: { app: email-worker }
  template:
    metadata:
      labels: { app: email-worker }
    spec:
      containers:
        - name: email-worker
          image: aiclipse/email-worker
          imagePullPolicy: IfNotPresent
          env:
            - name: REDIS_URI
              valueFrom: { secretKeyRef: { name: redis-sec, key: REDIS_URI } }
            - name: EMAIL_STREAM
              value: "auth-events"
            - name: EMAIL_GROUP
              value: "email-workers"
            - name: EMAIL_DLQ_STREAM
              value: "auth-events-dlq"
            - name: GMAIL_CLIENT_ID
              valueFrom: { secretKeyRef: { name: email-sec, key: GMAIL_CLIENT_ID } }
            - name: GMAIL_CLIENT_SECRET
              valueFrom: { secretKeyRef: { name: email-sec, key: GMAIL_CLIENT_SECRET } }
            - name: GMAIL_REFRESH_TOKEN
              valueFrom: { secretKeyRef: { name: email-sec, key: GMAIL_REFRESH_TOKEN } }
            - name: GMAIL_SENDER_EMAIL
              valueFrom: { secretKeyRef: { name: email-sec, key: GMAIL_SENDER_EMAIL } }
            - name: GMAIL_TOKEN_URL
              value: "https://oauth2.googleapis.com/token"
            - name: GMAIL_API_BASE
              value: "https://gmail.googleapis.com/gmail/v1"
            - name: GMAIL_TIMEOUT_S
              value: "15"
            - name: SUPPORT_EMAIL
              valueFrom: { secretKeyRef: { name: email-sec, key: SUPPORT_EMAIL } }
            - name: REDIS_CONNECT_TIMEOUT_S
              value: "3"
            - name: REDIS_SOCKET_TIMEOUT_S
              value: "8"
            - name: INTERNAL_AUTH_TOKEN
              valueFrom: { secretKeyRef: { name: jwt-sec, key: INTERNAL_AUTH_TOKEN } }
          ports:
            - { name: http, containerPort: 3000 }
          readinessProbe:
            httpGet: { path: /healthz, port: 3000, scheme: HTTP }
            initialDelaySeconds: 2
            periodSeconds: 10
            timeoutSeconds: 1
            failureThreshold: 3
          livenessProbe:
            httpGet: { path: /healthz, port: 3000, scheme: HTTP }
            initialDelaySeconds: 40
            periodSeconds: 20
            timeoutSeconds: 1
            failureThreshold: 3
          startupProbe:
            httpGet: { path: /healthz, port: 3000, scheme: HTTP }
            periodSeconds: 1
            failureThreshold: 60
          resources:
            requests: { cpu: "25m", memory: "64Mi" }
            limits: { cpu: "200m", memory: "256Mi" }
---
apiVersion: v1
kind: Service
metadata:
  name: email-worker-srv
spec:
  type: ClusterIP
  selector: { app: email-worker }
  ports:
    - { name: http, port: 3000, targetPort: 3000 }
