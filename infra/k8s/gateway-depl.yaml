apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway-depl
spec:
  replicas: 2
  selector: { matchLabels: { app: gateway } }
  template:
    metadata: { labels: { app: gateway } }
    spec:
      containers:
        - name: gateway
          image: aiclipse/gateway
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          env:
            - name: JWT_KEY
              valueFrom: { secretKeyRef: { name: jwt-sec, key: JWT_KEY } }
            - name: DETECTION_TOKEN_SECRET
              valueFrom: { secretKeyRef: { name: jwt-sec, key: DETECTION_TOKEN_SECRET } }
            - name: INTERNAL_AUTH_TOKEN
              valueFrom: { secretKeyRef: { name: jwt-sec, key: INTERNAL_AUTH_TOKEN } }
            - name: AUTH_URI
              value: "http://auth-srv:3000"
            - name: MEDIA_URI
              value: "http://media-srv:3000"
            - name: BILLING_URI
              value: "http://billing-srv:3000"
            - name: COMMUNITY_URI
              value: "http://community-srv:3000"
            - name: DETECTOR_URI
              value: "http://detector-srv:3000"
            - name: MODEL_CYCLE_URI
              value: "http://model-cycle-srv:3000"
          ports: [{ name: http, containerPort: 8080 }]
          readinessProbe:
            httpGet: { path: /healthz, port: 8080, scheme: HTTP }
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet: { path: /healthz, port: 8080, scheme: HTTP }
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 5
          startupProbe:
            httpGet: { path: /healthz, port: 8080, scheme: HTTP }
            periodSeconds: 2
            failureThreshold: 90 
          resources:
            requests: { cpu: "100m", memory: "256Mi" }
            limits:   { cpu: "1000m", memory: "768Mi" }

---
apiVersion: v1
kind: Service
metadata:
  name: gateway-srv
spec:
  type: ClusterIP
  selector: { app: gateway }
  ports: [{ name: http, port: 8080, targetPort: 8080 }]
