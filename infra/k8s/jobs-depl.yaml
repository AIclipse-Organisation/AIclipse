apiVersion: apps/v1
kind: Deployment
metadata:
  name: jobs-depl
spec:
  replicas: 1
  selector: { matchLabels: { app: jobs } }
  template:
    metadata: { labels: { app: jobs } }
    spec:
      containers:
        - name: jobs
          image: aiclipse/jobs
          env:
            - name: MONGO_URI
              valueFrom:
                secretKeyRef: { name: app-mongo-sec, key: MONGO_URI }
            - { name: REDIS_HOST, value: "redis-srv" }
            - { name: REDIS_PORT, value: "6379" }
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef: { name: redis-sec, key: REDIS_PASSWORD }
          ports: [{ name: http, containerPort: 3000 }]
          readinessProbe:
            { httpGet: { path: /healthz, port: 3000 }, initialDelaySeconds: 5 }
          livenessProbe:
            { httpGet: { path: /healthz, port: 3000 }, initialDelaySeconds: 15 }
          resources:
            requests: { cpu: "50m", memory: "128Mi" }
            limits: { cpu: "300m", memory: "512Mi" }
---
apiVersion: v1
kind: Service
metadata:
  name: jobs-srv
spec:
  type: ClusterIP
  selector: { app: jobs }
  ports: [{ name: http, port: 3000, targetPort: 3000 }]
