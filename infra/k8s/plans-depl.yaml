apiVersion: apps/v1
kind: Deployment
metadata:
  name: plans-depl
spec:
  replicas: 1
  selector: { matchLabels: { app: plans } }
  template:
    metadata: { labels: { app: plans } }
    spec:
      containers:
        - name: plans
          image: aiclipse/plans
          env:
            - { name: REDIS_HOST, value: "redis-srv" }
            - { name: REDIS_PORT, value: "6379" }
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef: { name: redis-sec, key: REDIS_PASSWORD }
          ports: [{ name: http, containerPort: 3000 }]
          readinessProbe:
            { httpGet: { path: /healthz, port: 3000 }, initialDelaySeconds: 5 }
          livenessProbe:
            { httpGet: { path: /healthz, port: 3000 }, initialDelaySeconds: 15 }
          resources:
            requests: { cpu: "25m", memory: "64Mi" }
            limits: { cpu: "200m", memory: "256Mi" }
---
apiVersion: v1
kind: Service
metadata:
  name: plans-srv
spec:
  type: ClusterIP
  selector: { app: plans }
  ports: [{ name: http, port: 3000, targetPort: 3000 }]
