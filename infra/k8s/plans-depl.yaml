apiVersion: apps/v1
kind: Deployment
metadata:
  name: plans-depl
spec:
  replicas: 1
  selector: { matchLabels: { app: plans } }
  template:
    metadata: { labels: { app: plans } }
    spec:
      containers:
        - name: plans
          image: aiclipse/plans
          env:
            - name: MONGO_URI
              valueFrom: { secretKeyRef: { name: mongo-sec, key: MONGO_URI } }
            - name: MONGO_DB
              valueFrom: { secretKeyRef: { name: mongo-sec, key: MONGO_DB } }

          ports: [{ name: http, containerPort: 3000 }]
          readinessProbe:
            httpGet: { path: /healthz, port: 3000, scheme: HTTP }
            initialDelaySeconds: 2
            periodSeconds: 10
            timeoutSeconds: 1
            failureThreshold: 3
          livenessProbe:
            httpGet: { path: /healthz, port: 3000, scheme: HTTP }
            initialDelaySeconds: 40
            periodSeconds: 20
            timeoutSeconds: 1
            failureThreshold: 3
          startupProbe:
            httpGet: { path: /healthz, port: 3000, scheme: HTTP }
            periodSeconds: 1
            failureThreshold: 60 
          resources:
            requests: { cpu: "25m", memory: "64Mi" }
            limits: { cpu: "200m", memory: "256Mi" }
---
apiVersion: v1
kind: Service
metadata:
  name: plans-srv
spec:
  type: ClusterIP
  selector: { app: plans }
  ports: [{ name: http, port: 3000, targetPort: 3000 }]
