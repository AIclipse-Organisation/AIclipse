apiVersion: v1
kind: Service
metadata:
  name: s3-headless
spec:
  clusterIP: None
  selector:
    app: s3
  ports:
    - { name: api, port: 9000, targetPort: 9000 }
    - { name: console, port: 9001, targetPort: 9001 }
---
apiVersion: v1
kind: Service
metadata:
  name: s3-srv
spec:
  type: ClusterIP
  selector:
    app: s3
  ports:
    - { name: api, port: 9000, targetPort: 9000 }
    - { name: console, port: 9001, targetPort: 9001 }
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: s3
spec:
  serviceName: s3-headless
  replicas: 1
  selector:
    matchLabels:
      app: s3

  persistentVolumeClaimRetentionPolicy:
    whenDeleted: Retain
    whenScaled: Retain

  template:
    metadata:
      labels:
        app: s3
    spec:
      securityContext:
        fsGroup: 999
        fsGroupChangePolicy: OnRootMismatch
      containers:
        - name: minio
          image: minio/minio:latest
          imagePullPolicy: IfNotPresent
          args: ["server", "/data", "--console-address", ":9001"]
          env:
            - name: MINIO_ROOT_USER
              valueFrom:
                secretKeyRef: { name: s3-sec, key: MINIO_ROOT_USER }
            - name: MINIO_ROOT_PASSWORD
              valueFrom:
                secretKeyRef: { name: s3-sec, key: MINIO_ROOT_PASSWORD }
          volumeMounts:
            - { name: data, mountPath: /data }
          ports:
            - { containerPort: 9000, name: api }
            - { containerPort: 9001, name: console }
          startupProbe:
            httpGet: { path: /minio/health/live, port: api }
            periodSeconds: 1
            failureThreshold: 90
          readinessProbe:
            httpGet: { path: /minio/health/ready, port: api }
            periodSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet: { path: /minio/health/live, port: api }
            initialDelaySeconds: 60
            periodSeconds: 10
            failureThreshold: 3
          resources:
            requests: { cpu: "100m", memory: "256Mi" }
            limits: { cpu: "500m", memory: "1024Mi" }

  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        storageClassName: hostpath-retain
        resources:
          requests:
            storage: 5Gi