<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>AIclipse – Model Demo</title>
    <link
      rel="stylesheet"
      href="{{ url_for('static', filename='style.css') }}"
    />
  </head>
  <body>
    <header class="header">
      <div class="logo">
        <img
          src="{{ url_for('static', filename='logo.png') }}"
          class="logo-img"
        />
      </div>
      <div class="user-circle">SM</div>
    </header>

    <main class="content">
      <h2>Upload</h2>
      <hr class="divider" />

      {% if error %}
      <p class="error">{{ error }}</p>
      {% endif %}

      <form method="POST" enctype="multipart/form-data">
        <label class="upload-btn">
          <input type="file" name="image" accept="image/*" required hidden />
          <span>+ Upload image to scan</span>
        </label>
        <button class="analyse-btn" type="submit">ANALYSE RESULTS</button>
      </form>
    </main>
  </body>
</html>
