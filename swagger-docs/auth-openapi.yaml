openapi: 3.0.3
info:
  title: Auth Service
  version: "0.0.1"
servers:
  - url: http://auth-srv:3000

paths:
  /signup:
    post:
      summary: Create user
      description: Create a new user account.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [user_name, email, password]
              properties:
                user_name:
                  type: string
                  minLength: 1
                  description: Display name of the user.
                email:
                  type: string
                  format: email
                  description: Unique email address.
                password:
                  type: string
                  format: password
                  description: Plain-text password to be hashed on the server.
      responses:
        "201":
          description: User created
          content:
            application/json:
              schema:
                type: object
                required:
                  [user_id, user_name, email, is_admin, plan, created_at]
                properties:
                  user_id:
                    type: string
                    description: Application-level user identifier.
                  user_name:
                    type: string
                  email:
                    type: string
                    format: email
                  is_admin:
                    type: boolean
                    default: false
                  plan:
                    type: integer
                    format: int32
                    minimum: 0
                    default: 0
                  created_at:
                    type: string
                    format: date-time
        "400":
          description: Invalid payload
        "409":
          description: Email already registered

  /login:
    post:
      summary: Issue JWT
      description: Validate credentials and issue a JWT access token.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email:
                  type: string
                  format: email
                password:
                  type: string
                  format: password
      responses:
        "200":
          description: Login successful
          content:
            application/json:
              schema:
                type: object
                required: [token, user]
                properties:
                  token:
                    type: string
                    description: JWT access token.
                  user:
                    type: object
                    required: [user_id, user_name, email, is_admin, plan]
                    properties:
                      user_id:
                        type: string
                      user_name:
                        type: string
                      email:
                        type: string
                        format: email
                      is_admin:
                        type: boolean
                      plan:
                        type: integer
                        format: int32
        "401":
          description: Invalid credentials

  /:
    get:
      summary: List all users
      description: Retrieve a list of all user accounts (sorted by newest first,
        password excluded). Optionally filter by username.
      parameters:
        - in: query
          name: user_name
          schema:
            type: string
          description: Filter users by username (case-insensitive substring match).
      responses:
        '200':
          description: List of users
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      type: object
                      required:
                        - user_id
                        - user_name
                        - email
                        - is_admin
                        - plan
                        - created_at
                      properties:
                        user_id:
                          type: string
                        user_name:
                          type: string
                        email:
                          type: string
                          format: email
                        is_admin:
                          type: boolean
                        plan:
                          type: integer
                          format: int32
                        created_at:
                          type: string
                          format: date-time
                        Age:
                          type: integer
                        Total_Guesses:
                          type: integer
                        Total_Correct:
                          type: integer
                        strikes:
                          type: integer
                        is_blacklisted:
                          type: boolean
        '500':
          description: Internal server error

  /{user_name}:
    get:
      summary: Get user by username
      description: Retrieve a specific user's profile by username (password excluded).
      parameters:
        - in: path
          name: user_name
          required: true
          schema:
            type: string
          description: Username (exact match).
      responses:
        '200':
          description: User profile
          content:
            application/json:
              schema:
                type: object
                required:
                  - user_id
                  - user_name
                  - email
                  - is_admin
                  - plan
                  - created_at
                properties:
                  user_id:
                    type: string
                  user_name:
                    type: string
                  email:
                    type: string
                    format: email
                  is_admin:
                    type: boolean
                  plan:
                    type: integer
                    format: int32
                  created_at:
                    type: string
                    format: date-time
                  Age:
                    type: integer
                  Total_Guesses:
                    type: integer
                  Total_Correct:
                    type: integer
                  strikes:
                    type: integer
                  is_blacklisted:
                    type: boolean
        '404':
          description: User not found
        '500':
          description: Internal server error

    patch:
      summary: Update user
      description: Update user fields. user_id cannot be changed. Password is
        auto-hashed if provided. Editable fields only.
      parameters:
        - in: path
          name: user_name
          required: true
          schema:
            type: string
          description: Username (exact match).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                user_name:
                  type: string
                  description: Display name (editable).
                email:
                  type: string
                  format: email
                  description: Email address (editable, must be unique).
                password:
                  type: string
                  format: password
                  description: New password (will be hashed).
                plan:
                  type: integer
                  format: int32
                  description: Subscription plan ID.
                Age:
                  type: integer
                  description: User age.
                is_blacklisted:
                  type: boolean
                  description: Blacklist status.
      responses:
        '200':
          description: User updated
          content:
            application/json:
              schema:
                type: object
                required:
                  - user_id
                  - user_name
                  - email
                  - is_admin
                  - plan
                  - created_at
                properties:
                  user_id:
                    type: string
                  user_name:
                    type: string
                  email:
                    type: string
                    format: email
                  is_admin:
                    type: boolean
                  plan:
                    type: integer
                    format: int32
                  created_at:
                    type: string
                    format: date-time
                  Age:
                    type: integer
                  Total_Guesses:
                    type: integer
                  Total_Correct:
                    type: integer
                  strikes:
                    type: integer
                  is_blacklisted:
                    type: boolean
        '400':
          description: Invalid input (e.g., update operators not allowed)
        '404':
          description: User not found
        '500':
          description: Internal server error

    delete:
      summary: Delete user
      description: Permanently remove a user account. Keeps logs and posts intact.
      parameters:
        - in: path
          name: user_name
          required: true
          schema:
            type: string
          description: Username (exact match).
      responses:
        '200':
          description: User deleted
          content:
            application/json:
              schema:
                type: object
                properties:
                  deleted:
                    type: boolean
                  user:
                    type: object
                    properties:
                      user_id:
                        type: string
                      email:
                        type: string
                        format: email
        '404':
          description: User not found
        '500':
          description: Internal server error

  /.well-known/jwks.json:
    get:
      summary: JSON Web Key Set (JWKS)
      description: >
        Return public keys used to verify JWT signatures issued by Auth Service.
        Gateway fetches and caches these keys to validate tokens locally.
      responses:
        "200":
          description: JWKS document
          content:
            application/json:
              schema:
                type: object
                required: [keys]
                properties:
                  keys:
                    type: array
                    items:
                      type: object
                      description: JSON Web Key
                      properties:
                        kty:
                          type: string
                        kid:
                          type: string
                        use:
                          type: string
                        alg:
                          type: string
                        n:
                          type: string
                        e:
                          type: string
