openapi: 3.0.3
info:
  title: Auth Service
  version: "0.0.2"
servers:
  - url: http://auth-srv:3000

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

paths:
  /signup:
    post:
      summary: Create user
      description: Create a new user account.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [user_name, email, password]
              properties:
                user_name:
                  type: string
                  minLength: 1
                  description: Display name of the user.
                email:
                  type: string
                  format: email
                  description: Unique email address.
                password:
                  type: string
                  format: password
                  description: Plain-text password to be hashed on the server.
      responses:
        "201":
          description: User created
          content:
            application/json:
              schema:
                type: object
                required:
                  [user_id, user_name, email, is_admin, plan, created_at]
                properties:
                  user_id:
                    type: string
                    description: Application-level user identifier.
                  user_name:
                    type: string
                  email:
                    type: string
                    format: email
                  is_admin:
                    type: boolean
                    default: false
                  plan:
                    type: integer
                    format: int32
                    minimum: 0
                    default: 0
                  created_at:
                    type: string
                    format: date-time
                  age:
                    type: integer
                    format: int32
                    minimum: 0
                    nullable: true
                  total_guesses:
                    type: integer
                    format: int32
                    minimum: 0
                    nullable: true
                  total_correct:
                    type: integer
                    format: int32
                    minimum: 0
                    nullable: true
        "400":
          description: Invalid payload
        "409":
          description: Email already registered

  /login:
    post:
      summary: Issue JWT
      description: Validate credentials and issue a JWT access token.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email:
                  type: string
                  format: email
                password:
                  type: string
                  format: password
      responses:
        "200":
          description: Login successful
          content:
            application/json:
              schema:
                type: object
                required: [token, user]
                properties:
                  token:
                    type: string
                    description: JWT access token.
                  user:
                    type: object
                    required: [user_id, user_name, email, is_admin, plan]
                    properties:
                      user_id:
                        type: string
                      user_name:
                        type: string
                      email:
                        type: string
                        format: email
                      is_admin:
                        type: boolean
                      plan:
                        type: integer
                        format: int32
        "401":
          description: Invalid credentials

  /.well-known/jwks.json:
    get:
      summary: JSON Web Key Set (JWKS)
      description: >
        Return public keys used to verify JWT signatures issued by Auth Service.
      responses:
        "200":
          description: JWKS document
          content:
            application/json:
              schema:
                type: object
                required: [keys]
                properties:
                  keys:
                    type: array
                    items:
                      type: object
                      description: JSON Web Key
                      properties:
                        kty:
                          type: string
                        kid:
                          type: string
                        use:
                          type: string
                        alg:
                          type: string
                        n:
                          type: string
                        e:
                          type: string

  /me:
    get:
      summary: Get current user profile
      description: Return the profile of the authenticated user.
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Current user profile
          content:
            application/json:
              schema:
                type: object
                required:
                  [user_id, user_name, email, is_admin, plan, created_at]
                properties:
                  user_id:
                    type: string
                  user_name:
                    type: string
                  email:
                    type: string
                    format: email
                  is_admin:
                    type: boolean
                  plan:
                    type: integer
                    format: int32
                  created_at:
                    type: string
                    format: date-time
                  age:
                    type: integer
                    format: int32
                    minimum: 0
                    nullable: true
                  total_guesses:
                    type: integer
                    format: int32
                    minimum: 0
                    nullable: true
                  total_correct:
                    type: integer
                    format: int32
                    minimum: 0
                    nullable: true
        "401":
          description: Unauthorized
    patch:
      summary: Update current user profile
      description: >
        Update profile fields for the authenticated user (name, email, password).
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                user_name:
                  type: string
                email:
                  type: string
                  format: email
                password:
                  type: string
                  format: password
      responses:
        "200":
          description: Updated user profile
          content:
            application/json:
              schema:
                type: object
                required:
                  [user_id, user_name, email, is_admin, plan, created_at]
                properties:
                  user_id:
                    type: string
                  user_name:
                    type: string
                  email:
                    type: string
                    format: email
                  is_admin:
                    type: boolean
                  plan:
                    type: integer
                    format: int32
                  created_at:
                    type: string
                    format: date-time
                  age:
                    type: integer
                    format: int32
                    minimum: 0
                    nullable: true
                  total_guesses:
                    type: integer
                    format: int32
                    minimum: 0
                    nullable: true
                  total_correct:
                    type: integer
                    format: int32
                    minimum: 0
                    nullable: true
        "400":
          description: Invalid payload
        "401":
          description: Unauthorized
    delete:
      summary: Delete current user account
      description: Permanently delete the authenticated user's account.
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Account deleted
          content:
            application/json:
              schema:
                type: object
                required: [deleted, user_id, message]
                properties:
                  deleted:
                    type: boolean
                  user_id:
                    type: string
                  message:
                    type: string
        "401":
          description: Unauthorized

  /admin/users:
    get:
      summary: List users
      description: >
        Admin-only endpoint to list users, optionally filtered by user_name.
      security:
        - bearerAuth: []
      parameters:
        - in: query
          name: user_name
          schema:
            type: string
          required: false
          description: Optional case-insensitive partial match on user_name.
      responses:
        "200":
          description: List of users
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      type: object
                      required:
                        [user_id, user_name, email, is_admin, plan, created_at]
                      properties:
                        user_id:
                          type: string
                        user_name:
                          type: string
                        email:
                          type: string
                          format: email
                        is_admin:
                          type: boolean
                        plan:
                          type: integer
                          format: int32
                        created_at:
                          type: string
                          format: date-time
        "401":
          description: Unauthorized

  /admin/user/{user_id}:
    get:
      summary: Get user by ID (admin)
      description: Admin-only endpoint to get a user's details by user_id.
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: user_id
          required: true
          schema:
            type: string
      responses:
        "200":
          description: User details
          content:
            application/json:
              schema:
                type: object
                required:
                  [user_id, user_name, email, is_admin, plan, created_at]
                properties:
                  user_id:
                    type: string
                  user_name:
                    type: string
                  email:
                    type: string
                    format: email
                  is_admin:
                    type: boolean
                  plan:
                    type: integer
                    format: int32
                  created_at:
                    type: string
                    format: date-time
        "401":
          description: Unauthorized
        "404":
          description: User not found
    patch:
      summary: Update user (admin)
      description: >
        Admin-only endpoint to update a user's info (name, email, password, age, is_admin).
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: user_id
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                user_name:
                  type: string
                email:
                  type: string
                  format: email
                password:
                  type: string
                  format: password
                age:
                  type: integer
                  format: int32
                  minimum: 0
                is_admin:
                  type: boolean
      responses:
        "200":
          description: Updated user
          content:
            application/json:
              schema:
                type: object
                required:
                  [user_id, user_name, email, is_admin, plan, created_at]
                properties:
                  user_id:
                    type: string
                  user_name:
                    type: string
                  email:
                    type: string
                    format: email
                  is_admin:
                    type: boolean
                  plan:
                    type: integer
                    format: int32
                  created_at:
                    type: string
                    format: date-time
        "400":
          description: Invalid payload
        "401":
          description: Unauthorized
        "404":
          description: User not found
    delete:
      summary: Delete user (admin)
      description: Admin-only endpoint to delete a user by user_id.
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: user_id
          required: true
          schema:
            type: string
      responses:
        "200":
          description: User deleted
          content:
            application/json:
              schema:
                type: object
                required: [deleted, user]
                properties:
                  deleted:
                    type: boolean
                  user:
                    type: object
                    properties:
                      user_id:
                        type: string
                      email:
                        type: string
                        format: email
        "401":
          description: Unauthorized
        "404":
          description: User not found
