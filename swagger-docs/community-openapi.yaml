          description: Model list
    post:
      summary: Upload model (admin)
      tags: [Admin BFF]
      description: >
        Streams multipart upload to Gateway /admin/models/upload via
        native HTTP. Body size limit 750 MB.
      security:
        - cookieAuth: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
      responses:
        "200":
          description: Model uploaded
        "400":
          description: Invalid Content-Type
        "401":
          description: Not admin
        "502":
          description: Gateway proxy error

