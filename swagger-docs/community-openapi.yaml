openapi: 3.0.3
info:
  title: Community Service
  version: "1.0.0"
  description: >
    Next.js App Router service with basePath "/community". Exposes three
    path layers, each with its own auth model:

    1. Public BFF (/community/*): browser-facing routes. Auth is resolved
       from the access_token cookie, which the service exchanges with
       Gateway /auth/me to obtain user identity.

    2. Internal (/community/internal/*): service-to-service routes called
       by Gateway's community proxy. Require X-Internal-Token header plus
       X-User-Id (and optional X-User-Name, X-User-Is-Admin) headers with
       forwarded user identity.

    3. Admin BFF (/community/adminBFF/*): admin-only browser routes. Auth
       is resolved from the access_token cookie; handlers proxy to
       Gateway /admin/* and /auth/admin/* using the admin's bearer JWT.

    Public BFF and Internal routes share the same handlers and behavior;
    they differ only in how the caller's identity is established.
servers:
  - url: http://community-srv:3000

components:
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: access_token
      description: Shared access token cookie issued by Auth service. Resolved via Gateway /auth/me.
    internalAuth:
      type: apiKey
      in: header
      name: X-Internal-Token
      description: Internal service-to-service token. Paired with X-User-* identity headers.

  parameters:
    XUserIdHeader:
      in: header
      name: X-User-Id
      required: true
      schema:
        type: string
      description: Forwarded user id from Gateway.
    XUserNameHeader:
      in: header
      name: X-User-Name
      required: false
      schema:
        type: string
    XUserIsAdminHeader:
      in: header
      name: X-User-Is-Admin
      required: false
      schema:
        type: string
        enum: ["true", "false"]

  schemas:
    Post:
      type: object
      properties:
        post_id:
          type: string
          example: "post_1714000000_abc123"
        user_id:
          type: string
        user_name:
          type: string
        image_id:
          type: string
        description:
          type: string
          maxLength: 1000
        result:
          type: string
          enum: [real, ai]
          nullable: true
        ground_truth:
          type: string
          enum: [real, ai]
          nullable: true
        is_admin_post:
          type: boolean
        clicks_count:
          type: integer
        up_vote_count:
          type: integer
        down_vote_count:
          type: integer
        comment_count:
          type: integer
        controversial_since:
          type: number
          nullable: true
          description: Unix seconds when post became controversial, or null.
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        user_vote:
          type: string
          enum: [up, down]
          nullable: true
          description: Current user's vote on this post (null if not voted).
        score:
          type: number
          description: Ranking score used for feed ordering.
        is_reported:
          type: boolean
        report_count:
          type: integer
        is_removed:
          type: boolean
        moderation_status:
          type: string
          enum: [removed, cleared, deleted]
          nullable: true

    Comment:
      type: object
      properties:
        comment_id:
          type: string
          example: "c_1714000000_abc123"
        post_id:
          type: string
        user_id:
          type: string
        user_name:
          type: string
        text:
          type: string
          maxLength: 1000
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    Notification:
      type: object
      description: >
        Collapsed notification. Each document represents a unique
        (recipient, actor, post, type, [vote_value|moderation_action])
        tuple; repeated events increment event_count instead of inserting.
      properties:
        notification_id:
          type: string
        recipient_user_id:
          type: string
        actor_user_id:
          type: string
        actor_user_name:
          type: string
          description: Resolved from auth.users at read time; falls back to "Someone".
        post_id:
          type: string
        type:
          type: string
          enum: [vote, comment, moderation]
        vote_value:
          type: string
          enum: [up, down]
          nullable: true
          description: Present when type=vote.
        moderation_action:
          type: string
          enum: [removed, deleted]
          nullable: true
          description: Present when type=moderation.
        moderation_reason:
          type: string
          nullable: true
        image_id:
          type: string
          nullable: true
        is_read:
          type: boolean
        event_count:
          type: integer
          description: Number of collapsed events in this notification.
        created_at:
          type: string
          format: date-time
          description: In list responses, overridden to last_event_at (most recent event).
        last_event_at:
          type: string
          format: date-time

    CreatePostRequest:
      type: object
      required: [image_id, description]
      properties:
        image_id:
          type: string
          pattern: '^[a-zA-Z0-9_-]+$'
          maxLength: 100
        description:
          type: string
          maxLength: 1000
        result:
          type: string
          enum: [real, ai]
          nullable: true
        ground_truth:
          type: string
          enum: [real, ai]
          nullable: true
        is_admin_post:
          type: boolean
          default: false

    UpdatePostRequest:
      type: object
      required: [description]
      properties:
        description:
          type: string
          maxLength: 1000

    VoteRequest:
      type: object
      required: [post_id, vote]
      properties:
        post_id:
          type: string
        vote:
          type: string
          enum: [up, down]

    VoteResponse:
      type: object
      properties:
        post_id:
          type: string
        up_vote_count:
          type: integer
        down_vote_count:
          type: integer
        user_vote:
          type: string
          enum: [up, down]
        points_awarded:
          type: integer

    ClickRequest:
      type: object
      required: [post_id]
      properties:
        post_id:
          type: string

    ClickResponse:
      type: object
      properties:
        post_id:
          type: string
        clicks_count:
          type: integer
        counted:
          type: boolean
          description: False if within 60s cooldown.

    ReportRequest:
      type: object
      required: [post_id]
      properties:
        post_id:
          type: string
        reason:
          type: string
          default: "General Flag"
        details:
          type: string

    ModerationRequest:
      type: object
      required: [post_id, action]
      properties:
        post_id:
          type: string
        action:
          type: string
          enum: [remove, dismiss]
        note:
          type: string

    ModerationStatusRequest:
      type: object
      required: [image_ids]
      properties:
        image_ids:
          type: array
          items:
            type: string

    CreateCommentRequest:
      type: object
      required: [post_id, text]
      properties:
        post_id:
          type: string
        text:
          type: string
          maxLength: 1000

    MarkReadRequest:
      type: object
      description: Provide exactly one of mark_all, post_id, or notification_ids.
      properties:
        mark_all:
          type: boolean
        post_id:
          type: string
        notification_ids:
          type: array
          items:
            type: string

    MarkReadResponse:
      type: object
      properties:
        ok:
          type: boolean
        modified_count:
          type: integer

    PostListResponse:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Post"
        hasMore:
          type: boolean

    CommentListResponse:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Comment"

    NotificationListResponse:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Notification"
        unread_count:
          type: integer

    UnreadCountResponse:
      type: object
      properties:
        unread_count:
          type: integer

    ModerationStatusResponse:
      type: object
      properties:
        items:
          type: array
          items:
            type: object
            properties:
              image_id:
                type: string
              moderation_status:
                type: string
                enum: [removed, cleared]
              moderation_reason:
                type: string

paths:
  /community/healthz:
    get:
      summary: Health check
      tags: [Health]
      responses:
        "200":
          description: OK (plain text "OK")

  # ─────────────────────────────────────────────────────────────────
  # PUBLIC BFF (cookieAuth) — browser-facing same-origin routes
  # ─────────────────────────────────────────────────────────────────
  /community/posts:
    get:
      summary: List posts
      tags: [Posts (public)]
      security:
        - cookieAuth: []
        - {}
      description: >
        Auth is optional; an unauthenticated caller gets posts without
        user_vote. Returns paginated posts with ranking score and Redis
        vote deltas merged in.
      parameters:
        - in: query
          name: page
          schema:
            type: integer
            default: 1
        - in: query
          name: limit
          schema:
            type: integer
            default: 10
        - in: query
          name: user_id
          schema:
            type: string
        - in: query
          name: image_id
          schema:
            type: string
        - in: query
          name: post_id
          schema:
            type: string
      responses:
        "200":
          description: Paginated posts
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PostListResponse"
    post:
      summary: Create post
      tags: [Posts (public)]
      security:
        - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreatePostRequest"
      responses:
        "201":
          description: Post created; image visibility synced via Gateway.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Post"
        "400":
          description: Missing fields, invalid image_id, description too long
        "401":
          description: Unauthorized
        "502":
          description: Failed to sync image visibility
    patch:
      summary: Update post description
      tags: [Posts (public)]
      security:
        - cookieAuth: []
      parameters:
        - in: query
          name: post_id
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdatePostRequest"
      responses:
        "200":
          description: Post updated
        "403":
          description: Not post owner
        "404":
          description: Post not found
    delete:
      summary: Delete post
      tags: [Posts (public)]
      description: >
        Soft-delete. Admin can delete any post. Cascades to comments,
        votes, image. Sends moderation notification when admin-initiated.
      security:
        - cookieAuth: []
      parameters:
        - in: query
          name: post_id
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Post deleted
        "403":
          description: Not owner and not admin
        "404":
          description: Post not found

  /community/posts/vote:
    post:
      summary: Vote on post
      tags: [Votes (public)]
      description: >
        One vote per user per post (immutable). Updates accuracy stats for
        admin posts with ground_truth. Queues vote delta to Redis
        (5s debounce, 60s max wait).
      security:
        - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VoteRequest"
      responses:
        "200":
          description: Vote recorded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VoteResponse"
        "400":
          description: Invalid input
        "403":
          description: Already voted on this post
        "404":
          description: Post not found

  /community/posts/click:
    post:
      summary: Track post click
      tags: [Clicks (public)]
      description: 60s cooldown per (user, post). Queues click delta to Redis.
      security:
        - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ClickRequest"
      responses:
        "200":
          description: Click recorded (or cooldown hit)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClickResponse"
        "400":
          description: Missing post_id
        "404":
          description: Post not found

  /community/posts/comments:
    get:
      summary: List comments for post
      tags: [Comments (public)]
      security:
        - cookieAuth: []
        - {}
      parameters:
        - in: query
          name: post_id
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Up to 100 comments, newest first
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CommentListResponse"
    post:
      summary: Create comment
      tags: [Comments (public)]
      description: >
        Text is normalized (CRLF→LF, collapsed whitespace, trimmed).
        Creates notification for post author. Queues comment delta to
        Redis (30s debounce, 60s max wait).
      security:
        - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateCommentRequest"
      responses:
        "201":
          description: Comment created
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Comment"
                  - type: object
                    properties:
                      comment_count:
                        type: integer
        "400":
          description: Invalid post_id, empty or too-long comment
        "404":
          description: Post not found
    delete:
      summary: Delete comment
      tags: [Comments (public)]
      security:
        - cookieAuth: []
      parameters:
        - in: query
          name: comment_id
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Comment deleted
        "403":
          description: Not comment author
        "404":
          description: Comment not found

  /community/posts/report:
    get:
      summary: List reported posts (admin)
      tags: [Moderation (public)]
      description: Admin only. Returns reported posts sorted by report_count desc.
      security:
        - cookieAuth: []
      responses:
        "200":
          description: Reported posts with report_history
        "403":
          description: Not admin
    post:
      summary: Report post
      tags: [Moderation (public)]
      security:
        - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReportRequest"
      responses:
        "200":
          description: Post reported
        "404":
          description: Post not found
    patch:
      summary: Moderate reported post (admin)
      tags: [Moderation (public)]
      description: >
        Admin action on a reported post. "remove" hides it and syncs
        image visibility; "dismiss" clears moderation status.
      security:
        - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ModerationRequest"
      responses:
        "200":
          description: Moderation action applied
        "403":
          description: Not admin

  /community/notifications:
    get:
      summary: List notifications
      tags: [Notifications (public)]
      description: Up to 50 collapsed notifications sorted by last_event_at desc.
      security:
        - cookieAuth: []
      parameters:
        - in: query
          name: unread_only
          schema:
            type: boolean
            default: false
      responses:
        "200":
          description: Notifications with unread_count
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NotificationListResponse"

  /community/notifications/unread-count:
    get:
      summary: Get unread notification count
      tags: [Notifications (public)]
      security:
        - cookieAuth: []
      responses:
        "200":
          description: Unread count
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UnreadCountResponse"

  /community/notifications/read:
    post:
      summary: Mark notifications as read
      tags: [Notifications (public)]
      security:
        - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MarkReadRequest"
      responses:
        "200":
          description: Marked as read
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MarkReadResponse"
        "400":
          description: No marking criteria provided

  # ─────────────────────────────────────────────────────────────────
  # INTERNAL (internalAuth + X-User-*) — called by Gateway proxy
  # ─────────────────────────────────────────────────────────────────
  /community/internal/posts:
    get:
      summary: List posts (internal)
      tags: [Posts (internal)]
      security:
        - internalAuth: []
      parameters:
        - $ref: "#/components/parameters/XUserIdHeader"
        - $ref: "#/components/parameters/XUserIsAdminHeader"
        - in: query
          name: page
          schema:
            type: integer
            default: 1
        - in: query
          name: limit
          schema:
            type: integer
            default: 10
        - in: query
          name: user_id
          schema:
            type: string
        - in: query
          name: image_id
          schema:
            type: string
        - in: query
          name: post_id
          schema:
            type: string
      responses:
        "200":
          description: Paginated posts
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PostListResponse"
    post:
      summary: Create post (internal)
      tags: [Posts (internal)]
      security:
        - internalAuth: []
      parameters:
        - $ref: "#/components/parameters/XUserIdHeader"
        - $ref: "#/components/parameters/XUserNameHeader"
        - $ref: "#/components/parameters/XUserIsAdminHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreatePostRequest"
      responses:
        "201":
          description: Post created; image visibility synced.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Post"
        "400":
          description: Invalid input
        "401":
          description: Unauthorized
        "502":
          description: Failed to sync image visibility
    patch:
      summary: Update post (internal)
      tags: [Posts (internal)]
      security:
        - internalAuth: []
      parameters:
        - $ref: "#/components/parameters/XUserIdHeader"
        - in: query
          name: post_id
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdatePostRequest"
      responses:
        "200":
          description: Post updated
        "403":
          description: Not post owner
        "404":
          description: Post not found
    delete:
      summary: Delete post (internal)
      tags: [Posts (internal)]
      security:
        - internalAuth: []
      parameters:
        - $ref: "#/components/parameters/XUserIdHeader"
        - $ref: "#/components/parameters/XUserIsAdminHeader"
        - in: query
          name: post_id
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Post deleted
        "403":
          description: Not owner and not admin
        "404":
          description: Post not found

  /community/internal/posts/vote:
    post:
      summary: Vote on post (internal)
      tags: [Votes (internal)]
      security:
        - internalAuth: []
      parameters:
        - $ref: "#/components/parameters/XUserIdHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VoteRequest"
      responses:
        "200":
          description: Vote recorded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VoteResponse"
        "400":
          description: Invalid input
        "403":
          description: Already voted on this post
        "404":
          description: Post not found

  /community/internal/posts/click:
    post:
      summary: Track post click (internal)
      tags: [Clicks (internal)]
      security:
        - internalAuth: []
      parameters:
        - $ref: "#/components/parameters/XUserIdHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ClickRequest"
      responses:
        "200":
          description: Click recorded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClickResponse"
        "400":
          description: Missing post_id
        "404":
          description: Post not found

  /community/internal/posts/comments:
    get:
      summary: List comments (internal)
      tags: [Comments (internal)]
      security:
        - internalAuth: []
      parameters:
        - in: query
          name: post_id
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Up to 100 comments, newest first
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CommentListResponse"
    post:
      summary: Create comment (internal)
      tags: [Comments (internal)]
      security:
        - internalAuth: []
      parameters:
        - $ref: "#/components/parameters/XUserIdHeader"
        - $ref: "#/components/parameters/XUserNameHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateCommentRequest"
      responses:
        "201":
          description: Comment created
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Comment"
                  - type: object
                    properties:
                      comment_count:
                        type: integer
        "400":
          description: Invalid input
        "404":
          description: Post not found
    delete:
      summary: Delete comment (internal)
      tags: [Comments (internal)]
      security:
        - internalAuth: []
      parameters:
        - $ref: "#/components/parameters/XUserIdHeader"
        - in: query
          name: comment_id
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Comment deleted
        "403":
          description: Not comment author
        "404":
          description: Comment not found

  /community/internal/posts/report:
    get:
      summary: List reported posts (admin, internal)
      tags: [Moderation (internal)]
      security:
        - internalAuth: []
      parameters:
        - in: header
          name: X-User-Is-Admin
          required: true
          schema:
            type: string
            enum: ["true"]
      responses:
        "200":
          description: Reported posts with report_history
        "403":
          description: Not admin
    post:
      summary: Report post (internal)
      tags: [Moderation (internal)]
      security:
        - internalAuth: []
      parameters:
        - $ref: "#/components/parameters/XUserIdHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReportRequest"
      responses:
        "200":
          description: Post reported
        "404":
          description: Post not found
    patch:
      summary: Moderate reported post (admin, internal)
      tags: [Moderation (internal)]
      security:
        - internalAuth: []
      parameters:
        - $ref: "#/components/parameters/XUserIdHeader"
        - in: header
          name: X-User-Is-Admin
          required: true
          schema:
            type: string
            enum: ["true"]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ModerationRequest"
      responses:
        "200":
          description: Moderation action applied

  /community/internal/posts/moderation-status:
    post:
      summary: Check image moderation status (internal)
      tags: [Moderation (internal)]
      description: >
        Batch lookup of moderation status for a list of image_ids.
        Internal-only — not exposed as a public BFF route.
      security:
        - internalAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ModerationStatusRequest"
      responses:
        "200":
          description: Moderation status per image
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ModerationStatusResponse"

  /community/internal/notifications:
    get:
      summary: List notifications (internal)
      tags: [Notifications (internal)]
      security:
        - internalAuth: []
      parameters:
        - $ref: "#/components/parameters/XUserIdHeader"
        - in: query
          name: unread_only
          schema:
            type: boolean
            default: false
      responses:
        "200":
          description: Notifications with unread_count
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NotificationListResponse"

  /community/internal/notifications/unread-count:
    get:
      summary: Unread count (internal)
      tags: [Notifications (internal)]
      security:
        - internalAuth: []
      parameters:
        - $ref: "#/components/parameters/XUserIdHeader"
      responses:
        "200":
          description: Unread count
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UnreadCountResponse"

  /community/internal/notifications/read:
    post:
      summary: Mark notifications read (internal)
