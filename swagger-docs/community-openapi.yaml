  # ─────────────────────────────────────────────────────────────────
  # ADMIN BFF (cookieAuth, admin JWT) — proxies to Gateway
  # ─────────────────────────────────────────────────────────────────
  /community/adminBFF/access-requests:
    get:
      summary: List access requests (admin)
      tags: [Admin BFF]
      description: Proxies to Gateway /auth/admin/access-requests.
      security:
        - cookieAuth: []
      parameters:
        - in: query
          name: search
          schema:
            type: string
        - in: query
          name: page
          schema:
            type: string
        - in: query
          name: page_size
          schema:
            type: string
      responses:
        "200":
          description: Paginated access requests
        "401":
          description: Not admin or missing admin token

  /community/adminBFF/access-requests/{userId}/approve:
    post:
      summary: Approve access request (admin)
      tags: [Admin BFF]
      description: Proxies to Gateway /auth/admin/access-requests/{userId}/approve.
      security:
        - cookieAuth: []
      parameters:
        - in: path
          name: userId
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Approved
        "400":
          description: Missing userId
        "401":
          description: Not admin

  /community/adminBFF/access-requests/{userId}/reject:
    delete:
      summary: Reject access request (admin)
      tags: [Admin BFF]
      description: Proxies to Gateway /auth/admin/access-requests/{userId}/reject (DELETE).
      security:
        - cookieAuth: []
      parameters:
        - in: path
          name: userId
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Rejected
        "400":
          description: Missing userId
        "401":
          description: Not admin

  /community/adminBFF/user-deletion-logs:
    get:
      summary: List user deletion logs (admin)
      tags: [Admin BFF]
      description: Proxies to Gateway /auth/admin/user-deletion-logs.
      security:
        - cookieAuth: []
      parameters:
        - in: query
          name: page
          schema:
            type: string
            default: "1"
        - in: query
          name: page_size
          schema:
            type: string
            default: "20"
      responses:
        "200":
          description: Paginated deletion logs

  /community/adminBFF/users:
    get:
      summary: List users (admin)
      tags: [Admin BFF]
      description: Proxies to Gateway /auth/admin/users.
      security:
        - cookieAuth: []
      parameters:
        - in: query
          name: search
          schema:
            type: string
        - in: query
          name: is_admin
          schema:
            type: string
        - in: query
          name: access_status
          schema:
            type: string
        - in: query
          name: sort
          schema:
            type: string
        - in: query
          name: order
          schema:
            type: string
        - in: query
          name: page
          schema:
            type: string
        - in: query
          name: page_size
          schema:
            type: string
      responses:
        "200":
          description: Paginated users
    post:
      summary: Create user (admin)
      tags: [Admin BFF]
      description: Proxies to Gateway /auth/admin/users.
      security:
        - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
      responses:
        "200":
          description: User created

  /community/adminBFF/users/{userId}:
    patch:
      summary: Update user (admin)
      tags: [Admin BFF]
      description: Proxies to Gateway /auth/admin/user/{userId} (PATCH).
      security:
        - cookieAuth: []
      parameters:
        - in: path
          name: userId
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
      responses:
        "200":
          description: User updated
    delete:
      summary: Delete user (admin)
      tags: [Admin BFF]
      description: Proxies to Gateway /auth/admin/user/{userId} (DELETE).
      security:
        - cookieAuth: []
      parameters:
        - in: path
          name: userId
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
