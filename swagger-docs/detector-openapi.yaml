openapi: 3.0.3
info:
  title: Detector Service
  version: "1.0.1"
servers:
  - url: http://detector-srv:3000

components:
  schemas:
    ModelUpdateRequest:
      type: object
      required: [version, minio_path]
      properties:
        version:
          type: string
          description: Version identifier for the new model.
        minio_path:
          type: string
          description: S3/MinIO object key to download model weights from.

    DetectionResultV1:
      type: object
      required: [verdict, label, confidence, model_version]
      properties:
        verdict:
          type: string
          enum: [REAL, FAKE]
        label:
          type: string
          enum: [real, fake, suspicious]
          description: >
            Confidence-banded label: <15% or >85% = real/fake,
            15-40% or 60-85% = real/fake, 40-60% = suspicious.
        confidence:
          type: number
          format: float
          minimum: 0
          maximum: 1
          description: Sigmoid-smoothed confidence score.
        model_version:
          type: string

    LegacyDetectionResult:
      type: object
      required: [is_ai, score]
      properties:
        is_ai:
          type: boolean
        score:
          type: number
          format: float

paths:
  /healthz:
    get:
      summary: Health check
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: ok

  /internal/reload-model:
    post:
      summary: Hot-reload model weights (internal)
      description: >
        Downloads new model weights from MinIO and performs an in-memory hot-swap.
        Old model versions are cleaned up from disk after swap.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ModelUpdateRequest"
      responses:
        "200":
          description: Model reloaded
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: success
                  version:
                    type: string
        "500":
          description: Reload failed
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string

  /v1.0.1/checks:
    post:
      summary: Run image detection (v1.0.1)
      tags: [v1.0.1]
      description: >
        Accept raw image bytes and return AI/deepfake detection result.
        Uses ViT model with confidence smoothing and label banding.
        Subject to concurrency limits (max inflight and max concurrent inference).
      parameters:
        - in: header
          name: X-Request-Id
          required: true
          schema:
            type: string
          description: Correlation ID for logs and tracing. Must be provided.
        - in: header
          name: X-User-Id
          required: false
          schema:
            type: string
          description: User ID for audit logging.
      requestBody:
        required: true
        content:
          application/octet-stream:
            schema:
              type: string
              format: binary
      responses:
        "200":
          description: Detection result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DetectionResultV1"
        "400":
          description: Missing X-Request-Id header or empty body
        "503":
          description: Service at capacity (all inference slots busy)
          content:
            application/json:
              schema:
                type: object
                properties:
                  detail:
                    type: string
                    example: busy
        "504":
          description: Inference timeout exceeded
          content:
            application/json:
              schema:
                type: object
                properties:
                  detail:
                    type: string
                    example: timeout

  /v1.0.0/checks:
    post:
      summary: Run image detection (v1.0.0) - legacy stub
      deprecated: true
      tags: [v1.0.0]
      description: >
        Legacy endpoint. Returns hardcoded values (is_ai=true, score=0.87).
        Do not use for production detection.
      parameters:
        - in: header
          name: X-Request-Id
          required: false
          schema:
            type: string
        - in: header
          name: X-User-Id
          required: false
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/octet-stream:
            schema:
              type: string
              format: binary
      responses:
        "200":
          description: Legacy detection result (hardcoded stub)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LegacyDetectionResult"
        "400":
          description: Empty body
