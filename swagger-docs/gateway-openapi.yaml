openapi: 3.0.3
info:
  title: Gateway Service
  version: "1.0.0"
servers:
  - url: http://localhost:8080
    description: Gateway local
  - url: http://gateway-srv:8080
    description: Gateway in-cluster

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

    apiKeyAuth:
      type: apiKey
      in: header
      name: X-Api-Key
      description: >
        Developer API key. Only accepted on /v1/checks and /checks.
        Gateway exchanges it internally for a short-lived JWT via Auth Service.

  schemas:
    DetectionResponse:
      type: object
      required: [verdict, label, confidence, model_version, detection_token]
      properties:
        verdict:
          type: string
          enum: [REAL, FAKE]
        label:
          type: string
          enum: [real, fake, suspicious]
        confidence:
          type: number
          format: float
          minimum: 0
          maximum: 1
        model_version:
          type: string
        detection_token:
          type: string
          description: >
            HS256 token binding detection result to image bytes and user.
            Must be passed to /upload/image. Valid for 10 minutes.

    SavedImage:
      type: object
      required: [image_id, verdict, label, confidence, is_public, uploaded_at]
      properties:
        image_id:
          type: string
        user_id:
          type: string
        s3_key:
          type: string
        verdict:
          type: string
        label:
          type: string
        confidence:
          type: number
          format: float
        model_version:
          type: string
          nullable: true
        is_public:
          type: boolean
        uploaded_at:
          type: string
          format: date-time
        is_reported:
          type: boolean
        url:
          type: string
          format: uri
          description: Presigned S3 URL.

    UpdateImageRequest:
      type: object
      properties:
        is_public:
          type: boolean
          nullable: true

    UsageLimitError:
      type: object
      properties:
        error:
          type: string
          example: usage_limit_exceeded
        message:
          type: string
        monthly_usage:
          type: integer
        limit:
          type: integer

paths:
  # ───────────────── Health ─────────────────
  /healthz:
    get:
      summary: Health check
      tags: [Health]
      responses:
        "200":
          description: OK

  # ───────────────── Auth Proxy (Public) ─────────────────
  /auth/signup:
    post:
      summary: User signup
      tags: [Auth]
      description: Proxy to Auth Service /signup.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [user_name, email, date_of_birth, password, how_did_you_find_us]
              properties:
                user_name:
                  type: string
                  minLength: 1
                email:
                  type: string
                  format: email
                date_of_birth:
                  type: string
                  pattern: '^\d{2}-\d{2}-\d{4}$'
                password:
                  type: string
                  format: password
                how_did_you_find_us:
                  type: string
                  enum: [social_media, browsing, friend_or_colleague, news_article, youtube, linkedin, other]
                how_did_you_find_us_detail:
                  type: string
      responses:
        "202":
          description: Signup request accepted (pending admin approval)
        "400":
          description: Invalid payload or weak password
        "409":
          description: Email already registered

  /auth/login:
    post:
      summary: User login
      tags: [Auth]
      description: Proxy to Auth Service /login.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email:
                  type: string
                  format: email
                password:
                  type: string
                  format: password
      responses:
        "200":
          description: Login successful (returns JWT and user profile)
        "401":
          description: Invalid credentials
        "403":
          description: Account pending admin approval

  /auth/public/user/{user_id}:
    get:
      summary: Get public user profile
      tags: [Auth]
      description: Proxy to Auth Service /public/user/{user_id}. No auth required.
      parameters:
        - in: path
          name: user_id
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Public user profile
        "404":
          description: User not found

  # ───────────────── Auth Proxy (Authenticated) ─────────────────
  /auth/me:
    get:
      summary: Get current user profile
      tags: [Auth]
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Current user profile
        "401":
          description: Unauthorized
    patch:
      summary: Update current user profile
      tags: [Auth]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                user_name:
                  type: string
                email:
                  type: string
                  format: email
                password:
                  type: string
                  format: password
                do_not_show_disclaimer_again:
                  type: boolean
                do_not_show_quick_start_again:
                  type: boolean
      responses:
        "200":
          description: Updated user profile
        "400":
          description: Invalid payload
        "401":
          description: Unauthorized
        "409":
          description: Email already registered
    delete:
      summary: Delete current user account
      tags: [Auth]
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Account deleted
        "401":
          description: Unauthorized

  # ───────────────── Auth Proxy (API Keys) ─────────────────
  /auth/api-key:
    get:
      summary: Get API key metadata
      tags: [Auth]
      security:
        - bearerAuth: []
      responses:
        "200":
          description: API key metadata (or null)
        "401":
          description: Unauthorized
    post:
      summary: Create/rotate API key
      tags: [Auth]
      security:
        - bearerAuth: []
      responses:
        "201":
          description: API key created/rotated (full key returned once)
        "401":
          description: Unauthorized
        "409":
          description: Rotation conflict; retry
    delete:
      summary: Revoke API key
      tags: [Auth]
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Revocation result
        "401":
          description: Unauthorized

  # ───────────────── Usage ─────────────────
  /usage/check:
    post:
      summary: Check usage quota
      tags: [Auth]
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Usage quota status
        "401":
          description: Unauthorized

  /usage/increment:
    post:
      summary: Record usage event
      tags: [Auth]
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Usage incremented
        "401":
          description: Unauthorized

  # ───────────────── Auth Proxy (Admin) ─────────────────
  /auth/admin/users:
    get:
      summary: List users (admin)
      tags: [Auth Admin]
      security:
        - bearerAuth: []
      parameters:
        - in: query
          name: search
          schema:
            type: string
        - in: query
          name: is_admin
          schema:
            type: boolean
        - in: query
          name: access_status
          schema:
            type: string
            enum: [approved, pending, rejected]
        - in: query
          name: sort
          schema:
            type: string
            enum: [created_at, user_name, email]
        - in: query
          name: order
          schema:
            type: string
            enum: [asc, desc]
        - in: query
          name: page
          schema:
            type: integer
        - in: query
          name: page_size
          schema:
            type: integer
      responses:
        "200":
          description: Paginated user list
        "401":
          description: Unauthorized
        "403":
          description: Admin privileges required
    post:
      summary: Create user (admin)
      tags: [Auth Admin]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [user_name, email, date_of_birth]
              properties:
                user_name:
                  type: string
                email:
                  type: string
                  format: email
                password:
                  type: string
                is_admin:
                  type: boolean
                date_of_birth:
                  type: string
      responses:
        "201":
          description: User created
        "400":
          description: Weak password
        "401":
          description: Unauthorized
        "403":
          description: Admin privileges required
        "409":
          description: Email already registered

  /auth/admin/user/{user_id}:
    get:
      summary: Get user by ID (admin)
      tags: [Auth Admin]
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: user_id
          required: true
          schema:
            type: string
      responses:
        "200":
          description: User details
        "401":
          description: Unauthorized
        "403":
          description: Admin privileges required
        "404":
          description: User not found
    patch:
      summary: Update user (admin)
      tags: [Auth Admin]
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: user_id
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                user_name:
                  type: string
                email:
                  type: string
                  format: email
                password:
                  type: string
                date_of_birth:
                  type: string
                is_admin:
                  type: boolean
      responses:
        "200":
          description: Updated user
        "400":
          description: Invalid payload
        "401":
          description: Unauthorized
        "403":
          description: Admin privileges required
        "404":
          description: User not found
        "409":
          description: Email already registered
    delete:
      summary: Delete user (admin)
      tags: [Auth Admin]
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: user_id
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason_code]
              properties:
                reason_code:
                  type: string
                  enum: [test_purpose, user_request, spam_abuse, security, other]
                reason_detail:
                  type: string
      responses:
        "200":
          description: User deleted
        "401":
          description: Unauthorized
        "403":
          description: Admin privileges required
        "404":
          description: User not found

  /auth/admin/user-deletion-logs:
    get:
      summary: List deletion audit logs (admin)
      tags: [Auth Admin]
      security:
        - bearerAuth: []
      parameters:
        - in: query
          name: page
          schema:
            type: integer
        - in: query
          name: page_size
          schema:
            type: integer
      responses:
        "200":
          description: Deletion logs
        "401":
          description: Unauthorized
        "403":
          description: Admin privileges required

  /auth/admin/access-requests:
    get:
      summary: List pending access requests (admin)
      tags: [Auth Admin]
      security:
        - bearerAuth: []
      parameters:
        - in: query
          name: search
          schema:
            type: string
        - in: query
          name: page
          schema:
            type: integer
        - in: query
          name: page_size
          schema:
            type: integer
      responses:
        "200":
          description: Pending access requests
        "401":
          description: Unauthorized
        "403":
          description: Admin privileges required

  /auth/admin/access-requests/{user_id}/approve:
    post:
      summary: Approve access request (admin)
      tags: [Auth Admin]
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: user_id
          required: true
          schema:
            type: string
      responses:
        "200":
          description: User approved
        "401":
          description: Unauthorized
        "403":
          description: Admin privileges required
        "404":
          description: No pending request

  /auth/admin/access-requests/{user_id}/reject:
    delete:
      summary: Reject access request (admin)
      tags: [Auth Admin]
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: user_id
          required: true
          schema:
            type: string
      responses:
        "200":
          description: User rejected
        "401":
          description: Unauthorized
        "403":
          description: Admin privileges required
        "404":
          description: No pending request

  # ───────────────── Detection ─────────────────
  /v1/checks:
    post:
      summary: Analyze image (v1)
      tags: [Detection]
      description: >
        Upload an image for AI/deepfake detection. No image is persisted.
        Free tier users (plan=0) are subject to 10 scans/month quota.
        Auth via Bearer JWT or X-Api-Key (API key only on this route and /checks).
      security:
        - bearerAuth: []
        - apiKeyAuth: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
                  description: Image file (JPEG or PNG).
      responses:
        "200":
          description: Detection result with detection_token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DetectionResponse"
        "400":
          description: Missing or invalid file
        "401":
          description: Unauthorized
        "403":
          description: Usage limit exceeded (free tier)
          content:
            application/json:
              schema:
                type: object
                properties:
                  detail:
                    $ref: "#/components/schemas/UsageLimitError"
        "413":
          description: Image exceeds 20 MB
        "415":
          description: Unsupported format or invalid dimensions (max 12000x12000, 40M pixels)
        "502":
          description: Detector service error
        "503":
          description: Service unavailable
        "504":
          description: Detector timeout

  /checks:
    post:
      summary: Analyze image (legacy alias)
      tags: [Detection]
      deprecated: true
      description: Legacy alias for /v1/checks. Same behavior.
      security:
        - bearerAuth: []
        - apiKeyAuth: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
      responses:
        "200":
          description: Detection result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DetectionResponse"
        "400":
          description: Missing or invalid file
        "401":
          description: Unauthorized
        "403":
          description: Usage limit exceeded
        "413":
          description: Image too large
        "415":
          description: Unsupported format
        "502":
          description: Detector service error
        "504":
          description: Detector timeout

  # ───────────────── Image Upload & Management ─────────────────
  /upload/image:
    post:
      summary: Save image after detection
      tags: [Images]
      description: >
        Save an image with its detection result. Gateway validates the detection_token
        (HS256, verifies user, image SHA256 hash, and expiry) then forwards trusted
        fields to Media Service. The detection_token is never forwarded downstream.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file, detection_token]
              properties:
                file:
                  type: string
                  format: binary
                detection_token:
                  type: string
                  description: Token from /v1/checks binding result to image bytes and user.
                is_public:
                  type: boolean
                  description: If true, image is public. Defaults to false.
      responses:
        "201":
          description: Image saved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SavedImage"
        "400":
          description: Invalid or expired detection_token, user/image mismatch
        "401":
          description: Unauthorized
        "413":
          description: Image too large
        "415":
          description: Unsupported format
        "502":
          description: Media service error
        "503":
          description: Media service unavailable

  /images:
    get:
      summary: Get current user's images
      tags: [Images]
      security:
        - bearerAuth: []
      parameters:
        - in: query
          name: is_public
          schema:
            type: boolean
          description: Filter by public/private visibility.
      responses:
        "200":
          description: List of user's images
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/SavedImage"
        "401":
          description: Unauthorized

  /image/{image_id}:
    get:
      summary: Get single image
      tags: [Images]
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: image_id
          required: true
          schema:
            type: string
            pattern: '^[A-Za-z0-9_-]{1,128}$'
      responses:
        "200":
          description: Image metadata with presigned URL
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SavedImage"
        "401":
          description: Unauthorized
        "404":
          description: Image not found or invalid image_id

    patch:
      summary: Update image metadata
      tags: [Images]
      description: Update image visibility. Owner or admin only.
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: image_id
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateImageRequest"
      responses:
        "200":
          description: Updated image
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SavedImage"
        "400":
          description: No valid fields to update
        "401":
          description: Unauthorized
        "403":
          description: Not owner and not admin
        "404":
          description: Image not found

    delete:
      summary: Delete image
      tags: [Images]
      description: Delete an image. Owner or admin only.
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: image_id
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Image deleted
        "401":
          description: Unauthorized
        "403":
          description: Not owner and not admin
        "404":
          description: Image not found

  /internal/images/lookup:
    post:
      summary: Batch lookup public images (internal)
      tags: [Images]
      description: Internal endpoint for looking up public images by IDs.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [image_ids]
              properties:
                image_ids:
                  type: array
                  items:
                    type: string
      responses:
        "200":
          description: Matching public images

  # ───────────────── Billing Proxy ─────────────────
  /billing/create-checkout-session:
    post:
      summary: Create checkout session
      tags: [Billing]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [user_id, plan_id, email]
              properties:
                user_id:
                  type: string
                plan_id:
                  type: integer
                  enum: [1, 2]
                email:
                  type: string
                  format: email
      responses:
        "200":
          description: Checkout session created
        "400":
          description: Invalid input
        "503":
          description: Billing service unavailable

  /api/billing/create-checkout-session:
    post:
      summary: Create checkout session (API path)
      tags: [Billing]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [user_id, plan_id, email]
              properties:
                user_id:
                  type: string
                plan_id:
                  type: integer
                email:
                  type: string
                  format: email
      responses:
        "200":
          description: Checkout session created
        "400":
          description: Invalid input

  /api/billing/config:
    get:
      summary: Get billing config
      tags: [Billing]
      responses:
        "200":
          description: Stripe publishable key

  /api/billing/subscription/status:
    get:
      summary: Get subscription status
      tags: [Billing]
      parameters:
        - in: query
          name: user_id
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Subscription status
        "400":
          description: Invalid user_id

  /api/billing/subscription/cancel-at-period-end:
    post:
      summary: Cancel subscription at period end
      tags: [Billing]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [user_id, reason]
              properties:
                user_id:
                  type: string
                reason:
                  type: string
      responses:
        "200":
          description: Cancellation scheduled
        "400":
          description: Invalid input or no active subscription
        "404":
          description: No subscription found

  /billing/webhook:
    post:
      summary: Stripe webhook
      tags: [Billing]
      description: >
        Proxied as raw bytes to preserve Stripe signature verification.
        Also accessible at /api/billing/webhook.
      parameters:
        - in: header
          name: stripe-signature
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/octet-stream:
            schema:
              type: string
              format: binary
      responses:
        "200":
          description: Webhook processed
        "400":
          description: Invalid payload or signature

  # ───────────────── Community Proxy ─────────────────
  /community/posts:
    get:
      summary: List community posts
      tags: [Community]
      description: Proxy to Community Service. Auth optional for read.
      security:
        - bearerAuth: []
      parameters:
        - in: query
          name: page
          schema:
            type: integer
        - in: query
          name: limit
          schema:
            type: integer
        - in: query
          name: user_id
          schema:
            type: string
        - in: query
          name: image_id
          schema:
            type: string
        - in: query
          name: post_id
          schema:
            type: string
      responses:
        "200":
          description: List of posts
    post:
      summary: Create community post
      tags: [Community]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [image_id, description]
              properties:
                image_id:
                  type: string
                description:
                  type: string
                  maxLength: 1000
                result:
                  type: string
                  enum: [real, ai]
                  nullable: true
                ground_truth:
                  type: string
                  enum: [real, ai]
                  nullable: true
                is_admin_post:
                  type: boolean
      responses:
        "201":
          description: Post created
        "400":
          description: Invalid input
        "401":
          description: Unauthorized
    patch:
      summary: Update community post
      tags: [Community]
      security:
        - bearerAuth: []
      parameters:
        - in: query
          name: post_id
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [description]
              properties:
                description:
                  type: string
                  maxLength: 1000
      responses:
        "200":
          description: Post updated
        "403":
          description: Not owner
        "404":
          description: Post not found
    delete:
      summary: Delete community post
      tags: [Community]
      security:
        - bearerAuth: []
      parameters:
        - in: query
          name: post_id
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Post deleted
        "403":
          description: Not owner and not admin
        "404":
          description: Post not found

  /community/posts/vote:
    post:
      summary: Vote on post
      tags: [Community]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [post_id, vote]
              properties:
                post_id:
                  type: string
                vote:
                  type: string
                  enum: [up, down]
      responses:
        "200":
          description: Vote recorded (votes are immutable)
        "400":
          description: Invalid input
        "403":
          description: Already voted on this post

  /community/posts/click:
    post:
      summary: Track post click
      tags: [Community]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [post_id]
              properties:
