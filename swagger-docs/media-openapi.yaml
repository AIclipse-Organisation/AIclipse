openapi: 3.0.3
info:
  title: Media Service
  version: "1.0.0"
servers:
  - url: http://media-srv:3000

components:
  schemas:
    ImageRecord:
      type: object
      required: [image_id, user_id, s3_key, verdict, label, confidence, is_public, uploaded_at, is_reported]
      properties:
        image_id:
          type: string
          example: "img_a1b2c3d4"
        user_id:
          type: string
        s3_key:
          type: string
          description: Object key in MinIO (format image_id.ext).
        verdict:
          type: string
        label:
          type: string
        confidence:
          type: number
          format: float
          minimum: 0
          maximum: 1
        model_version:
          type: string
          nullable: true
        is_public:
          type: boolean
        uploaded_at:
          type: string
          format: date-time
        is_reported:
          type: boolean
        url:
          type: string
          format: uri
          description: Presigned S3 URL. Public images get 1h TTL, private get 5min TTL.

    ImageLookupRequest:
      type: object
      required: [image_ids]
      properties:
        image_ids:
          type: array
          items:
            type: string

paths:
  /healthz:
    get:
      summary: Health check
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: ok

  /upload/image:
    post:
      summary: Store image and metadata
      description: >
        Stores an image in MinIO and creates a metadata record.
        If MongoDB insert fails after S3 upload, the S3 object is rolled back.
        Allowed content types: image/jpeg, image/png. Max size: 20 MB.
        The caller's user identity is forwarded by the gateway as the
        X-User-Id header; callers must not supply it in the form body.
      parameters:
        - in: header
          name: X-User-Id
          required: true
          schema:
            type: string
          description: User id forwarded by the gateway from the authenticated JWT.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file, verdict, label, confidence, model_version, is_public]
              properties:
                file:
                  type: string
                  format: binary
                verdict:
                  type: string
                label:
                  type: string
                confidence:
                  type: number
                  format: float
                model_version:
                  type: string
                is_public:
                  type: boolean
      responses:
        "201":
          description: Image stored and metadata created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ImageRecord"
        "400":
          description: Missing model_version or invalid input
        "413":
          description: File exceeds 20 MB limit
        "415":
          description: Unsupported content type (not JPEG/PNG)
        "422":
          description: Missing X-User-Id header
        "500":
          description: Failed to store image in S3
        "503":
          description: MongoDB unavailable

  /images:
    get:
      summary: List images
      description: >
        Returns up to 200 images sorted by uploaded_at descending.
        Each image includes a presigned S3 URL.
      parameters:
        - in: query
          name: user_id
          schema:
            type: string
          description: Filter by owner user ID.
        - in: query
          name: is_public
          schema:
            type: boolean
          description: Filter by public visibility.
      responses:
        "200":
          description: List of images
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/ImageRecord"
        "503":
          description: MongoDB unavailable

  /images/lookup:
    post:
      summary: Batch lookup public images
      description: >
        Returns public images matching the given IDs, preserving request order.
        Non-existent or non-public IDs are silently skipped.
        Duplicate IDs are deduplicated.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ImageLookupRequest"
      responses:
        "200":
          description: Matching public images
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/ImageRecord"
        "503":
          description: MongoDB unavailable

  /image/{image_id}:
    get:
      summary: Get single image
      description: >
        Returns image metadata if the caller owns it (user_id matches)
        or if the image is public. Otherwise returns 404.
      parameters:
        - in: path
          name: image_id
          required: true
          schema:
            type: string
        - in: query
          name: user_id
          required: false
          schema:
            type: string
          description: Owner ID for private access check.
      responses:
        "200":
          description: Image metadata with presigned URL
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ImageRecord"
        "404":
          description: Not found or not accessible
        "503":
          description: MongoDB unavailable

    patch:
      summary: Update image metadata
      description: Currently only is_public can be updated. Requires owner or admin.
      parameters:
        - in: path
          name: image_id
          required: true
          schema:
            type: string
        - in: query
          name: user_id
          required: false
          schema:
            type: string
          description: Owner ID for permission check.
        - in: query
          name: is_public
          required: false
          schema:
            type: boolean
          description: New public visibility value.
        - in: header
          name: X-User-Is-Admin
          required: false
          schema:
            type: boolean
            default: false
          description: Admin override flag (set by Gateway).
      responses:
        "200":
          description: Updated image
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ImageRecord"
        "400":
          description: No valid fields to update
        "403":
          description: Not owner and not admin
        "404":
          description: Image not found
        "503":
          description: MongoDB unavailable

    delete:
      summary: Delete image
      description: Deletes from S3 first, then removes MongoDB record. Requires owner or admin.
      parameters:
        - in: path
          name: image_id
          required: true
          schema:
            type: string
        - in: query
          name: user_id
          required: false
          schema:
            type: string
        - in: header
          name: X-User-Is-Admin
          required: false
          schema:
            type: boolean
            default: false
      responses:
        "200":
          description: Image deleted
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                  image_id:
                    type: string
        "403":
          description: Not owner and not admin
        "404":
          description: Image not found
        "500":
          description: Failed to delete from S3
        "503":
          description: MongoDB unavailable
