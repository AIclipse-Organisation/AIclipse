openapi: 3.0.3
info:
  title: Model Cycle Service
  version: "1.0.0"
  description: >
    Model lifecycle management: image confidence evaluation, training jobs,
    model deployment, and version history. Built with C# ASP.NET Core.
servers:
  - url: http://model-cycle-srv:3000

components:
  schemas:
    EvaluateImageRequest:
      type: object
      required: [MediaImageId]
      properties:
        PostId:
          type: string
        MediaImageId:
          type: string
        S3Key:
          type: string
          nullable: true
        Label:
          type: string
          default: Unknown
        ModelConfidence:
          type: number
          format: double
        Votes:
          type: array
          items:
            $ref: "#/components/schemas/UserVoteDto"

    UserVoteDto:
      type: object
      required: [UserId]
      properties:
        UserId:
          type: string
        IsAiVote:
          type: boolean
          description: "true = AI vote, false = Real vote"

    EvaluateResponse:
      type: object
      description: Shaped response from the workflow's ConfidenceResult.
      properties:
        Label:
          type: string
          enum: [ai, real]
          description: Training label chosen by the Bayesian workflow.
        IsReady:
          type: boolean
          description: True when evidence is sufficient to add to training set.
        CurrentProbability:
          type: number
          format: double
          minimum: 0
          maximum: 1
        Action:
          type: string
          enum: ["Added to Training Set", "Waiting for more votes"]

    CreateModelUploadSessionRequest:
      type: object
      required: [Version, FileName, FileSize]
      properties:
        Version:
          type: string
          description: Semantic version (e.g. v1.0.0). Auto-prefixes "v" if omitted.
        FileName:
          type: string
          description: "Original model filename. Supported extensions: .pt, .bin, .safetensors."
        FileSize:
          type: integer
          format: int64
          minimum: 1
          maximum: 786432000
          description: Exact file size in bytes (max 750 MB).
        ContentType:
          type: string
          description: Browser-provided MIME type. Defaults to application/octet-stream.

    CreateModelUploadSessionResponse:
      type: object
      required: [UploadId, UploadUrl, UploadMethod, UploadHeaders, ExpiresAt]
      properties:
        UploadId:
          type: string
          description: Opaque signed upload session token used when finalizing the model.
        UploadUrl:
          type: string
          format: uri
          description: Presigned object-storage URL for the direct PUT upload.
        UploadMethod:
          type: string
          example: PUT
        UploadHeaders:
          type: object
          additionalProperties:
            type: string
          description: Headers the browser must send to the presigned upload URL.
        ExpiresAt:
          type: string
          format: date-time
          description: Upload session expiry timestamp in UTC.

    FinalizeModelUploadRequest:
      type: object
      required: [UploadId, Version]
      properties:
        UploadId:
          type: string
        Version:
          type: string
          description: Semantic version (e.g. v1.0.0). Auto-prefixes "v" if omitted.
        NewImagesCount:
          type: integer
        ReplayBufferCount:
          type: integer
        ValidationAccuracy:
          type: number
          format: double
        ValidationPrecision:
          type: number
          format: double
        ValidationRecall:
          type: number
          format: double
        ValidationF1Score:
          type: number
          format: double
        GoldenTestAccuracy:
          type: number
          format: double
        GoldenTestPrecision:
          type: number
          format: double
        GoldenTestRecall:
          type: number
          format: double
        GoldenTestF1Score:
          type: number
          format: double
        GoldenFakeToRealMisclassifications:
          type: integer
        GoldenRealToFakeMisclassifications:
          type: integer
        NewTrainingImageIds:
          type: array
          items:
            type: string
            format: uuid
        ReplayImageIds:
          type: array
          items:
            type: string
            format: uuid
        GoldenTestImageIds:
          type: array
          items:
            type: string
            format: uuid

    ModelWeights:
      type: object
      properties:
        Id:
          type: string
          format: uuid
        Version:
          type: string
        MinioObjectPath:
          type: string
        CreatedAt:
          type: string
          format: date-time
        NewImagesCount:
          type: integer
        ReplayBufferCount:
          type: integer
        ValidationAccuracy:
          type: number
          format: double
        ValidationPrecision:
          type: number
          format: double
        ValidationRecall:
          type: number
          format: double
        ValidationF1Score:
          type: number
          format: double
        GoldenTestAccuracy:
          type: number
          format: double
        GoldenTestPrecision:
          type: number
          format: double
        GoldenTestRecall:
          type: number
          format: double
        GoldenTestF1Score:
          type: number
          format: double
        GoldenFakeToRealMisclassifications:
          type: integer
        GoldenRealToFakeMisclassifications:
          type: integer
        IsDeployed:
          type: boolean
        RejectionReason:
          type: string
          nullable: true

    CurrentModel:
      type: object
      properties:
        Version:
          type: string
        Accuracy:
          type: number
          format: double
        Precision:
          type: number
          format: double
        Recall:
          type: number
          format: double
        DeployedAt:
          type: string
          format: date-time

    TrainingImage:
      type: object
      properties:
        Id:
          type: string
          format: uuid
        MediaImageId:
          type: string
        S3Key:
          type: string
        Label:
          type: string
        Status:
          type: string
          enum: [Pending, Ready, UsedInTraining]
        UploadedAt:
          type: string
          format: date-time
        UserAiVotes:
          type: integer
        UserRealVotes:
          type: integer
        ModelConfidenceScore:
          type: number
          format: double
        ModelVersion:
          type: string
          nullable: true

paths:
  /healthz:
    get:
      summary: Health check
      tags: [Health]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: ok

  /:
    get:
      summary: Service info
      tags: [Health]
      responses:
        "200":
          description: Service identification
          content:
            application/json:
              schema:
                type: object
                properties:
                  service:
                    type: string
                    example: model-cycle
                  message:
                    type: string
                  env:
                    type: object
                    properties:
                      hostname:
                        type: string
                      pod:
                        type: string

  /api/imageconfidence/evaluate:
    post:
      summary: Evaluate image confidence
      tags: [Image Confidence]
      description: >
        Evaluates an image based on model confidence and user votes using
        Bayesian inference (Beta distribution). Determines if the image is
        ready for training. User vote weights are based on historical accuracy
        fetched from Auth Service.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EvaluateImageRequest"
      responses:
        "200":
          description: Confidence evaluation result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EvaluateResponse"
        "400":
          description: Evaluation failed

  /api/models/train:
    post:
      summary: Trigger training cycle
      tags: [Models]
      description: >
        Queues a training job. Only one pending training is held at a time.
        Training collects balanced Ready images, adds replay buffer,
        runs Python training script, evaluates metrics, and deploys if improved.
      responses:
        "202":
          description: Training signal queued
          content:
            application/json:
              schema:
                type: object
                properties:
                  Message:
                    type: string

  /images:
    get:
      summary: List training images
      tags: [Training Images]
      description: All training images with metadata, ordered by UploadedAt descending.
      responses:
        "200":
          description: Training images
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/TrainingImage"

  /api/models/current:
    get:
      summary: Get currently deployed model
      tags: [Models]
      responses:
        "200":
          description: Current model info
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CurrentModel"
        "404":
          description: No deployed model found

  /api/models/uploads:
    post:
      summary: Create a direct-upload session for a model
      tags: [Models]
      description: >
        Returns a presigned object-storage PUT URL for browser-direct upload.
        The control plane stays on the authenticated admin path, but the
        model bytes bypass application servers. The service may also reap
        expired abandoned staging objects older than the upload-session TTL.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateModelUploadSessionRequest"
      responses:
        "200":
          description: Upload session created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreateModelUploadSessionResponse"
        "400":
          description: Invalid version, file size, or file extension
        "409":
          description: Model version already exists

  /api/models/uploads/finalize:
    post:
      summary: Finalize a direct-uploaded model and deploy it
      tags: [Models]
      description: >
        Validates the uploaded object against the signed upload session,
        promotes the staged upload to the canonical release key
        `models/{version}.{ext}`, stores model lineage in SQLite,
        deactivates prior deployments, and notifies Detector Service for hot-swap.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FinalizeModelUploadRequest"
      responses:
        "200":
          description: Model uploaded and deployed
          content:
            application/json:
              schema:
                type: object
                properties:
                  Message:
                    type: string
                  Id:
                    type: string
                    format: uuid
                  Version:
                    type: string
                  ImagesLinked:
                    type: integer
        "400":
          description: Invalid or expired upload session
        "409":
          description: Upload missing, size mismatch, or version conflict

  /api/models:
    get:
      summary: List all model versions
      tags: [Models]
      description: Returns all model versions ordered by CreatedAt descending.
      responses:
        "200":
          description: Model version history
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ModelWeights"

  /api/models/{version}:
    delete:
      summary: Delete a model version
      tags: [Models]
      description: Deletes model metadata from SQLite and attempts to delete from MinIO.
      parameters:
        - in: path
          name: version
          required: true
          schema:
            type: string
          description: "Semantic version (e.g. v1.0.0). Auto-prepends 'v' if missing."
      responses:
        "200":
          description: Model deleted
          content:
            application/json:
              schema:
                type: object
                properties:
                  Message:
                    type: string
        "404":
          description: Model version not found
