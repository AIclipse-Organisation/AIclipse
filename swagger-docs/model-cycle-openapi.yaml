openapi: 3.0.3
info:
  title: Model Cycle Service
  version: "1.0.0"
  description: >
    Model lifecycle management: image confidence evaluation, training jobs,
    model deployment, and version history. Built with C# ASP.NET Core.
servers:
  - url: http://model-cycle-srv:3000

components:
  schemas:
    EvaluateImageRequest:
      type: object
      required: [MediaImageId]
      properties:
        PostId:
          type: string
        MediaImageId:
          type: string
        S3Key:
          type: string
          nullable: true
        Label:
          type: string
          default: Unknown
        ModelConfidence:
          type: number
          format: double
        Votes:
          type: array
          items:
            $ref: "#/components/schemas/UserVoteDto"

    UserVoteDto:
      type: object
      required: [UserId]
      properties:
        UserId:
          type: string
        IsAiVote:
          type: boolean
          description: "true = AI vote, false = Real vote"

    EvaluateResponse:
      type: object
      description: Shaped response from the workflow's ConfidenceResult.
      properties:
        Label:
          type: string
          enum: [ai, real]
          description: Training label chosen by the Bayesian workflow.
        IsReady:
          type: boolean
          description: True when evidence is sufficient to add to training set.
        CurrentProbability:
          type: number
          format: double
          minimum: 0
          maximum: 1
        Action:
          type: string
          enum: ["Added to Training Set", "Waiting for more votes"]

    CreateModelUploadSessionRequest:
      type: object
      required: [Version, FileName, FileSize]
      properties:
        Version:
          type: string
          description: Semantic version (e.g. v1.0.0). Auto-prefixes "v" if omitted.
        FileName:
          type: string
          description: "Original model filename. Supported extensions: .pt, .bin, .safetensors."
        FileSize:
          type: integer
          format: int64
          minimum: 1
          maximum: 786432000
          description: Exact file size in bytes (max 750 MB).
        ContentType:
          type: string
          description: Browser-provided MIME type. Defaults to application/octet-stream.

    CreateModelUploadSessionResponse:
      type: object
      required: [uploadId, uploadMethod, partSizeBytes, totalParts, expiresAt]
      properties:
        uploadId:
          type: string
          description: Opaque signed upload session token used for chunk uploads and finalize.
        uploadMethod:
          type: string
          example: PUT
        partSizeBytes:
          type: integer
          format: int32
          description: Exact chunk size for every part except the last one.
        totalParts:
          type: integer
          format: int32
          minimum: 1
          description: Total number of sequential parts required for this upload.
        expiresAt:
          type: string
          format: date-time
          description: Upload session expiry timestamp in UTC.

    UploadModelPartResponse:
      type: object
      required: [partNumber]
      properties:
        partNumber:
          type: integer
          format: int32
          minimum: 1
          description: 1-based part number acknowledged by the server.

    FinalizeModelUploadResponse:
      type: object
      required: [message, id, version, imagesLinked]
      properties:
        message:
          type: string
        id:
          type: string
          format: uuid
        version:
          type: string
        imagesLinked:
          type: integer

    ModelUploadErrorResponse:
      type: object
      required: [detail]
      properties:
        detail:
          type: string

    FinalizeModelUploadRequest:
      type: object
      required: [UploadId, Version]
      properties:
        UploadId:
          type: string
        Version:
          type: string
          description: Semantic version (e.g. v1.0.0). Auto-prefixes "v" if omitted.
        NewImagesCount:
          type: integer
        ReplayBufferCount:
          type: integer
        ValidationAccuracy:
          type: number
          format: double
        ValidationPrecision:
          type: number
          format: double
        ValidationRecall:
          type: number
          format: double
        ValidationF1Score:
          type: number
          format: double
        GoldenTestAccuracy:
          type: number
          format: double
        GoldenTestPrecision:
          type: number
          format: double
        GoldenTestRecall:
          type: number
          format: double
        GoldenTestF1Score:
          type: number
          format: double
        GoldenFakeToRealMisclassifications:
          type: integer
        GoldenRealToFakeMisclassifications:
          type: integer
        NewTrainingImageIds:
          type: array
          items:
            type: string
            format: uuid
        ReplayImageIds:
          type: array
          items:
            type: string
            format: uuid
        GoldenTestImageIds:
          type: array
          items:
            type: string
            format: uuid

    ModelWeights:
      type: object
      properties:
        Id:
          type: string
          format: uuid
        Version:
          type: string
        MinioObjectPath:
          type: string
        CreatedAt:
          type: string
          format: date-time
        NewImagesCount:
          type: integer
        ReplayBufferCount:
          type: integer
        ValidationAccuracy:
          type: number
          format: double
        ValidationPrecision:
          type: number
          format: double
        ValidationRecall:
          type: number
          format: double
        ValidationF1Score:
          type: number
          format: double
        GoldenTestAccuracy:
          type: number
          format: double
        GoldenTestPrecision:
          type: number
          format: double
        GoldenTestRecall:
          type: number
          format: double
        GoldenTestF1Score:
          type: number
          format: double
        GoldenFakeToRealMisclassifications:
          type: integer
        GoldenRealToFakeMisclassifications:
          type: integer
        IsDeployed:
          type: boolean
        RejectionReason:
          type: string
          nullable: true

    CurrentModel:
      type: object
      properties:
        Version:
          type: string
        Accuracy:
          type: number
          format: double
        Precision:
          type: number
          format: double
        Recall:
          type: number
          format: double
        DeployedAt:
          type: string
          format: date-time

    TrainingImage:
      type: object
      properties:
        Id:
          type: string
          format: uuid
        MediaImageId:
          type: string
        S3Key:
          type: string
        Label:
          type: string
        Status:
          type: string
          enum: [Pending, Ready, UsedInTraining]
        UploadedAt:
          type: string
          format: date-time
        UserAiVotes:
          type: integer
        UserRealVotes:
          type: integer
        ModelConfidenceScore:
          type: number
          format: double
        ModelVersion:
          type: string
          nullable: true

paths:
  /healthz:
    get:
      summary: Health check
      tags: [Health]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: ok

  /:
    get:
      summary: Service info
      tags: [Health]
      responses:
        "200":
          description: Service identification
          content:
            application/json:
              schema:
                type: object
                properties:
                  service:
                    type: string
                    example: model-cycle
                  message:
                    type: string
                  env:
                    type: object
                    properties:
                      hostname:
                        type: string
                      pod:
                        type: string

  /api/imageconfidence/evaluate:
    post:
      summary: Evaluate image confidence
      tags: [Image Confidence]
      description: >
        Evaluates an image based on model confidence and user votes using
        Bayesian inference (Beta distribution). Determines if the image is
        ready for training. User vote weights are based on historical accuracy
        fetched from Auth Service.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EvaluateImageRequest"
      responses:
        "200":
          description: Confidence evaluation result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EvaluateResponse"
        "400":
          description: Evaluation failed

  /api/models/train:
    post:
      summary: Trigger training cycle
      tags: [Models]
      description: >
        Queues a training job. Only one pending training is held at a time.
        Training collects balanced Ready images, adds replay buffer,
        runs Python training script, evaluates metrics, and deploys if improved.
      responses:
        "202":
          description: Training signal queued
          content:
            application/json:
              schema:
                type: object
                properties:
                  Message:
                    type: string

  /images:
    get:
      summary: List training images
      tags: [Training Images]
      description: All training images with metadata, ordered by UploadedAt descending.
      responses:
        "200":
          description: Training images
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/TrainingImage"

  /api/models/current:
    get:
      summary: Get currently deployed model
      tags: [Models]
      responses:
        "200":
          description: Current model info
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CurrentModel"
        "404":
          description: No deployed model found

  /api/models/uploads:
    post:
      summary: Create a chunked upload session for a model
      tags: [Models]
      description: >
        Creates an authenticated upload session for a manual admin model
        upload. The response defines the bounded chunk contract
        (`uploadMethod`, `partSizeBytes`, `totalParts`, `expiresAt`).
        Model Cycle may also reap expired abandoned staging directories
        older than the upload-session TTL while creating the session.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateModelUploadSessionRequest"
      responses:
        "200":
          description: Upload session created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreateModelUploadSessionResponse"
        "400":
          description: Invalid version, file size, or file extension
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ModelUploadErrorResponse"
        "409":
          description: Model version already exists
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ModelUploadErrorResponse"

  /api/models/uploads/parts/{partNumber}:
    put:
      summary: Upload one staged model chunk
      tags: [Models]
      description: >
        Streams one numbered chunk into the active upload session. Chunks
        must arrive in order and match the approved size for the session.
      parameters:
        - in: path
          name: partNumber
          required: true
          schema:
            type: integer
            minimum: 1
          description: 1-based sequential part number for this upload.
        - in: header
          name: X-Upload-Id
          required: true
          schema:
            type: string
          description: Opaque upload session token returned by POST /api/models/uploads.
      requestBody:
        required: true
        content:
          application/octet-stream:
            schema:
              type: string
              format: binary
      responses:
        "200":
          description: Chunk accepted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UploadModelPartResponse"
        "400":
          description: Invalid upload session, part number, content type, or part size
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ModelUploadErrorResponse"
        "409":
          description: Out-of-order chunk or staged size mismatch
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ModelUploadErrorResponse"

  /api/models/uploads/finalize:
    post:
      summary: Finalize a staged model upload and deploy it
      tags: [Models]
      description: >
        Validates the staged file against the signed upload session,
        uploads the canonical release key `models/{version}.{ext}`,
        stores model lineage in SQLite,
        deactivates prior deployments, and notifies Detector Service for hot-swap.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FinalizeModelUploadRequest"
      responses:
        "200":
          description: Model uploaded and deployed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FinalizeModelUploadResponse"
        "400":
          description: Invalid or expired upload session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ModelUploadErrorResponse"
        "409":
          description: Upload missing, size mismatch, or version conflict
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ModelUploadErrorResponse"

  /api/models:
    get:
      summary: List all model versions
      tags: [Models]
      description: Returns all model versions ordered by CreatedAt descending.
      responses:
        "200":
          description: Model version history
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ModelWeights"

  /api/models/{version}:
    delete:
      summary: Delete a model version
      tags: [Models]
      description: Deletes model metadata from SQLite and attempts to delete from MinIO.
      parameters:
        - in: path
          name: version
          required: true
          schema:
            type: string
          description: "Semantic version (e.g. v1.0.0). Auto-prepends 'v' if missing."
      responses:
        "200":
          description: Model deleted
          content:
            application/json:
              schema:
                type: object
                properties:
                  Message:
                    type: string
        "404":
          description: Model version not found
